<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Forza-WCCF</title>
<style>
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;font:600 14px system-ui,sans-serif;overflow:hidden;touch-action:none}
#app{display:grid;grid-template-columns:1fr 18vmin;grid-template-rows:1fr auto;gap:1.5vmin;height:100%;padding:1.5vmin}
#pitch{position:relative;background:linear-gradient(#1f6b35,#185a2c);border:2px solid #cfe8d4;border-radius:8px}
#pitch::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #cfe8d455}
#side{display:flex;flex-direction:column;gap:1vmin}
.box{position:relative;flex:1;border:2px dashed #ffffff40;border-radius:8px}
#off{flex:.7;border-color:#d0505080;display:flex;align-items:center;justify-content:center;color:#f08080;font-size:12px;text-align:center}
.card{position:absolute;width:12vmin;height:16.5vmin;margin:-8.25vmin 0 0 -6vmin;border-radius:6px;background:#2b3440 center/cover no-repeat;
 border:2px solid #9aa6b2;touch-action:none;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.box .card{left:50%;top:50%}
.card span{background:#000a;font-size:11px;padding:2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.AllTime{border-color:#e0c060}.card.Legend{border-color:#c080ff}.card.Rare{border-color:#60b0ff}.card.Special{border-color:#60e0a0}
.card.drag{z-index:10;opacity:.9;box-shadow:0 0 0 3px #fff}
.card.hot{box-shadow:0 0 0 3px #ffd040}
#keys{grid-column:1/3;display:flex;gap:1vmin}
#keys button{flex:1;min-height:9vmin;border:0;border-radius:8px;background:#30363d;color:#fff;font:700 13px system-ui;touch-action:none}
#keys button.down{background:#d0a030;color:#000}
#keys button.big{flex:1.4;background:#a33}
#keys button.big.down{background:#ffd040}
#msg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:#000d;padding:14px 18px;border-radius:8px;display:none;max-width:80vw;text-align:center}
</style>
</head>
<body>
<div id="app">
 <div id="pitch"></div>
 <div id="side"><div class="box" data-slot="11"></div><div class="box" data-slot="12"></div><div class="box" data-slot="13"></div>
  <div class="box" data-slot="14"></div><div class="box" data-slot="15"></div><div class="box" id="off"></div></div>
 <div id="keys"></div>
</div>
<div id="msg"></div>
<script>
"use strict";
const T = {
 en:{off:"TAKE OFF",conn:"Connecting...",lost:"Connection lost: reconnecting...",other:"Another tablet took over the board.",stopped:"The board stopped (the game ended or the option was turned off).",bad:"This link is old: scan the QR code in the game's SETTINGS again."},
 it:{off:"TOGLI",conn:"Connessione...",lost:"Connessione persa: riconnessione...",other:"Un altro tablet ha preso la formazione.",stopped:"La formazione si è fermata (partita finita o opzione spenta).",bad:"Questo link è vecchio: scansiona di nuovo il codice QR nelle IMPOSTAZIONI del gioco."},
 ja:{off:"外す",conn:"接続中...",lost:"接続が切れました：再接続中...",other:"別のタブレットがボードを使っています。",stopped:"ボードが停止しました（ゲーム終了またはオフ）。",bad:"このリンクは古いです：ゲームの設定でQRコードを読み直してください。"}};
const L = T[(navigator.language || "en").slice(0, 2)] || T.en;
const token = new URLSearchParams(location.search).get("t") || "";
const pitch = document.getElementById("pitch"), msg = document.getElementById("msg");
document.getElementById("off").textContent = L.off;
let ws = null, done = false, drag = null;
for (const ev of ["gesturestart", "dblclick", "contextmenu"]) document.addEventListener(ev, e => e.preventDefault());
function say(t) { msg.textContent = t; msg.style.display = t ? "block" : "none"; }
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

// the cabinet's buttons: down on touch, up on release (the server keeps each one down at least 140 ms)
const KEYS = [["START","START",1],["PRESS","PRESS",0],["SHOOT","SHOOT",1],["KEEPER","KEEPER",0],["DATA","DATA",0],
 ["KEYPLAYER","KEY PLAYER",0],["UP","CENTRAL",0],["DOWN","COUNTER",0],["LEFT","L-SIDE",0],["RIGHT","R-SIDE",0]];
for (const [a, label, big] of KEYS) {
 const b = document.createElement("button");
 b.textContent = label; if (big) b.className = "big";
 const up = () => { if (b.classList.contains("down")) { b.classList.remove("down"); send({t:"key", a, down:false}); } };
 b.addEventListener("pointerdown", e => { e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add("down"); send({t:"key", a, down:true}); });
 b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up); b.addEventListener("lostpointercapture", up);
 document.getElementById("keys").appendChild(b);
}

function draw(cards) {
 if (drag) return;  // the next state after the drop redraws
 document.querySelectorAll(".card").forEach(c => c.remove());
 for (const c of cards) {
  const d = document.createElement("div");
  d.className = "card " + c.rarity; d.dataset.slot = c.slot;
  d.style.backgroundImage = "url(c/" + c.no + "?t=" + token + ")";
  const s = document.createElement("span"); s.textContent = c.pos + " " + c.short; d.appendChild(s);
  if (c.slot < 11) { d.style.left = ((c.x + 1) / 2 * 100) + "%"; d.style.top = ((c.y + 1) / 2 * 100) + "%"; pitch.appendChild(d); }
  else document.querySelector('.box[data-slot="' + c.slot + '"]').appendChild(d);
  d.addEventListener("pointerdown", grab);
 }
}

function grab(e) {
 if (drag) return;
 const d = e.currentTarget; e.preventDefault(); d.setPointerCapture(e.pointerId);
 drag = {d, from: +d.dataset.slot, x0: e.clientX, y0: e.clientY};
 d.classList.add("drag");
 d.addEventListener("pointermove", move); d.addEventListener("pointerup", drop); d.addEventListener("pointercancel", cancel);
 d.addEventListener("lostpointercapture", cancel);
}
function target(x, y) {
 for (const el of document.elementsFromPoint(x, y)) {
  if (el === drag.d || drag.d.contains(el)) continue;
  if (el.classList.contains("card")) return {slot: +el.dataset.slot, el};
  if (el.id === "off") return {off: true};
  if (el.classList.contains("box")) return {slot: +el.dataset.slot, el};
  if (el === pitch) return {pitch: true};
 }
 return {off: true};  // dropped outside the board: taken off
}
function move(e) {
 drag.d.style.transform = "translate3d(" + (e.clientX - drag.x0) + "px," + (e.clientY - drag.y0) + "px,0)";
 document.querySelectorAll(".hot").forEach(h => h.classList.remove("hot"));
 const t = target(e.clientX, e.clientY); if (t.el) t.el.classList.add("hot");
}
function finish() {
 const d = drag.d; d.removeEventListener("pointermove", move); d.removeEventListener("pointerup", drop); d.removeEventListener("pointercancel", cancel);
 d.removeEventListener("lostpointercapture", cancel);
 document.querySelectorAll(".hot").forEach(h => h.classList.remove("hot"));
 drag = null;
}
function drop(e) {
 const from = drag.from, moved = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8;
 const t = target(e.clientX, e.clientY);
 finish();
 if (!moved) return draw(last);
 if (t.pitch) {
  const r = pitch.getBoundingClientRect();
  send({t:"move", from, x:(e.clientX - r.left) / r.width * 2 - 1, y:(e.clientY - r.top) / r.height * 2 - 1});
 } else if (t.off) send({t:"off", slot:from});
 else if (t.slot !== from) send({t:"swap", from, to:t.slot});
 else draw(last);
}
function cancel() { if (drag) { finish(); draw(last); } }

let last = [];
function connect() {
 if (done) return;
 ws = new WebSocket("ws://" + location.host + "/ws?t=" + encodeURIComponent(token));
 ws.onopen = () => say("");
 ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.t === "state") { last = m.cards; draw(last); }
  else if (m.t === "bye") { done = true; say(m.why === "other" ? L.other : L.stopped); }
 };
 ws.onclose = () => { if (!done) { say(L.lost); setTimeout(connect, 1500); } };
}
// a wrong token gets no page at all; an old page whose token is gone gets 403 on the socket and keeps retrying
fetch("c/0?t=" + encodeURIComponent(token)).then(r => { if (r.status === 403) { done = true; say(L.bad); } else connect(); }, connect);
say(L.conn);
</script>
</body>
</html>
