[package]
name = "launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Launcher.exe: the WCCF 2010-11 kit's launcher"

[lib]
name = "launcher"
path = "src/lib.rs"

[[bin]]
name = "Launcher"
path = "src/bin/launcher/main.rs"

[dependencies]
# the window: forza's launcher screen in eframe (wgpu; our fonts from fonts\, no default_fonts), pickers through rfd
eframe.workspace = true
forza.workspace = true
rfd.workspace = true
vslink = { path = "../vslink" }
regex = "1.13.1"
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["local-offset"] }
zip.workspace = true
junction.workspace = true
windows.workspace = true
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Multimedia",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
csv = "1.4.0"
object.workspace = true
sha2.workspace = true

[dev-dependencies]
forza-server = { path = "../server" }
tempfile = "3.27.0"

[lints]
workspace = true
