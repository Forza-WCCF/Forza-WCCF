forza-ui.workspace = true
fs4.workspace = true
ntfs.workspace = true
pbkdf2.workspace = true
rfd.workspace = true
ripemd.workspace = true
serde_json.workspace = true
sha2.workspace = true
tl.workspace = true
zip.workspace = true

[lints]
workspace = true
