[package]
name = "wccf-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Forza-WCCF installer for user-supplied RingEdge disc images"
license = "MIT"
repository = "https://github.com/Forza-WCCF/WCCF-Installer"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
crc32fast = "1.5.2"
eframe = "0.35.0"
fs4 = "1.1.0"
hmac = "0.13.0"
ntfs = "0.4.0"
pbkdf2 = "0.13.0"
rfd = "0.17.2"
ripemd = "0.2.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
sha2 = "0.11.0"

[lints]
workspace = true
