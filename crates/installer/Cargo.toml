[package]
name = "wccf-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Forza-WCCF installer for user-supplied RingEdge disc images"
license.workspace = true
repository = "https://github.com/Forza-WCCF/Forza-WCCF"

# the shipped exe is Forza-WCCF-Installer.exe; the package keeps its name for `-p wccf-installer`
[[bin]]
name = "Forza-WCCF-Installer"
path = "src/main.rs"

[dependencies]
