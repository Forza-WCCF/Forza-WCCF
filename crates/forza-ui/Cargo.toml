[package]
name = "forza-ui"
version = "0.5.1" # its own version, not the release number (docs/RELEASING.md)
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Forza-WCCF's shared UI: the theme, the bespoke widgets and the screens (step 9 design)"

[dependencies]
forza.workspace = true
egui.workspace = true
# `file` and `image`: the card pictures, read and decoded off the UI thread by egui's loaders (PNG only)
egui_extras = { workspace = true, features = ["file", "image"] }
rust-i18n.workspace = true
# the catalogue's search: accents and other scripts folded to plain letters ("kaka" finds KAKÀ)
deunicode = "1.6.2"
time = { version = "0.3.55", features = ["local-offset"] }
# SETTINGS' tablet board: its address as a QR code, drawn as egui rectangles (no image)
qrcode = { version = "0.14.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Globalization"] }

[dev-dependencies]
eframe.workspace = true
egui_kittest.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile = "3.27.0"

[lints]
workspace = true

[[example]]
name = "gallery"
