[package]
name = "vslink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Forza-WCCF's direct VS link for the 2017-18 edition: loopback tokens over an iroh connection (docs/IROH_VS_PLAN.md)"

[dependencies]
forza = { workspace = true, default-features = false }
bytes.workspace = true
getrandom.workspace = true
iroh.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }

[dev-dependencies]
# the in-process relay server (iroh::test_utils::run_relay_server) and CaTlsConfig::insecure_skip_verify
iroh = { workspace = true, features = ["test-utils"] }
# examples/nat_peer.rs: a test relay bound where the Docker NAT harness's homes reach it (test_utils binds loopback only)
iroh-relay = { version = "1.3.0", default-features = false, features = ["server", "test-utils"] }

[lints]
workspace = true
