[package]
name = "forza-server"
version = "0.6.0" # its own version, not the release number (docs/RELEASING.md)
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Forza-WCCF online server: seat desk, match relay and game server (Windows and Linux)"

[[bin]]
name = "forza-server"
path = "src/main.rs"

[dependencies]
clap.workspace = true
forza = { workspace = true, default-features = false }
ipnet = "2.12"
getrandom = "0.3.4"
# a shop room's tunnel id must be a real ed25519 public key, as iroh takes it (shoproom.rs)
ed25519-dalek = { version = "3.0.0", default-features = false }
regex = "1.13.1"
time = { version = "0.3.55", features = ["local-offset"] }

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
