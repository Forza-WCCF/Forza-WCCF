[package]
name = "forza-server"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Forza-WCCF online server: seat desk, match relay and log inbox (Windows and Linux)"

[[bin]]
name = "forza-server"
path = "src/main.rs"

[dependencies]
clap.workspace = true
forza = { workspace = true, default-features = false }
ipnet = "2.12"
getrandom = "0.3.4"
regex = "1.13.1"
time = { version = "0.3.55", features = ["local-offset"] }

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
