[package]
name = "forza"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Forza-WCCF's shared UI: the theme, the bespoke widgets and the screens (step 9 design)"

[features]
# `ui` (default): the egui screens. The Linux server builds `forza` with `--no-default-features`.
default = ["ui"]
ui = ["dep:csv", "dep:deunicode", "dep:egui", "dep:egui_extras", "dep:image", "dep:rust-i18n"]

[dependencies]
aes.workspace = true
sha2.workspace = true
# the catalogue (catalogue.tsv), forza::cards
csv = { version = "1.4.0", optional = true }
serde_json.workspace = true
egui = { workspace = true, optional = true }
# `file` and `image`: the card pictures, read and decoded off the UI thread by egui's loaders (PNG only); image's
# `dds` and `jpeg`: the pictures made from the game (DXT1) and from the high-quality pack (forza::cards::pictures)
egui_extras = { workspace = true, optional = true, features = ["file", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "dds", "jpeg"], optional = true }
rust-i18n = { workspace = true, optional = true }
zip.workspace = true
getrandom = "0.3.4"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["local-offset"] }
# the catalogue's search: accents and other scripts folded to plain letters ("kaka" finds KAKÀ)
deunicode = { version = "1.6.2", optional = true }
# the game server stand-in's club store (gamesvr.db); bundled: no system SQLite on the cabinet PC
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_IO", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
eframe.workspace = true
egui_kittest.workspace = true

[[example]]
name = "gallery"
required-features = ["ui"]

[[test]]
name = "snapshots"
required-features = ["ui"]

[[test]]
name = "text"
required-features = ["ui"]

[lints]
workspace = true
