[package]
name = "forza"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Forza-WCCF's shared UI: the theme, the bespoke widgets and the screens (step 9 design)"

[dependencies]
aes.workspace = true
serde_json.workspace = true
egui.workspace = true
egui_extras.workspace = true
rust-i18n.workspace = true
getrandom = "0.3.4"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["local-offset"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security"] }

[dev-dependencies]
sha2.workspace = true
eframe.workspace = true
egui_kittest.workspace = true

[lints]
workspace = true
