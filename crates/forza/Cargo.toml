[package]
name = "forza"
version = "0.6.0" # its own version, not the release number (docs/RELEASING.md)
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Forza-WCCF's shared code: setup, the stand-ins, online play, the cards and the game text (the screens are forza-ui)"

[features]
# `full` (default): the cards, the game text and the install steps. The Linux server builds `forza` with `--no-default-features`.
default = ["full"]
full = ["dep:csv", "dep:encoding_rs", "dep:image", "dep:freetype-rs", "dep:regex", "dep:unicode-normalization"]

[dependencies]
aes.workspace = true
sha2.workspace = true
# the catalogue (catalogue.tsv), forza::cards
csv = { version = "1.4.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }   # forza::text keeps the backup manifest's key order
# egui's geometry alone (Pos2, Rect): the card table's spots (forza::board)
emath.workspace = true
# `dds` and `jpeg`: the pictures made from the game (DXT1) and from the high-quality pack (forza::cards::pictures)
image = { version = "0.25.10", default-features = false, features = ["png", "dds", "jpeg"], optional = true }
zip.workspace = true
getrandom = "0.3.4"
tempfile = "3.27.0"
# setup (2010-11): whether seat 1's hard link is already the game's file
same-file = "1.0.6"
# one player's cards across seasons: names spelt with and without accents (Petr CECH / Petr ČECH)
deunicode = "1.6.2"
time = { version = "0.3.55", features = ["local-offset"] }
# the game text (forza::text): the printf/$ codes of a line, and the Latin spelling of player names
regex = { version = "1.13.1", optional = true }
unicode-normalization = { version = "0.1.25", optional = true }
# the 2017-18 pictures with writing (forza::text::pictures): FreeType, built from source, as Pillow draws the words
freetype-rs = { version = "0.38.0", features = ["bundled"], optional = true }
# the catalogue reads the original records' Shift-JIS (cp932) names
encoding_rs = { version = "0.8.42", optional = true }
# the game server stand-in's club store (gamesvr.db); bundled: no system SQLite on the cabinet PC
rusqlite = { version = "0.40.2", features = ["bundled"] }
# LAN shops (online::lan): each network's broadcast address and this PC's own addresses
netdev = { version = "0.46.3", default-features = false }

[target.'cfg(windows)'.dependencies]
junction.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",               # save_logs: pc.txt display mode (EnumDisplaySettingsW)
    "Win32_Media_Multimedia",           # keys: the controllers (joyGetPosEx)
    "Win32_NetworkManagement_IpHelper", # procs: the ports a process listens on (GetTcpTable, read only)
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Com",                 # save_logs: CoTaskMemFree
    "Win32_System_SystemInformation",   # save_logs: pc.txt RAM (GlobalMemoryStatusEx)
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",                   # save_logs: the Downloads folder (SHGetKnownFolderPath)
    "Win32_UI_WindowsAndMessaging",
] }
# sound: Core Audio's COM interfaces (the start volumes)
windows.workspace = true

[lints]
workspace = true

[[example]]
name = "catalogue"
required-features = ["full"]

[[example]]
name = "english"
required-features = ["full"]

[[example]]
name = "card_steps"
required-features = ["full"]
