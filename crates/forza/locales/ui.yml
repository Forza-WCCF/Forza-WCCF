club.msg_asked: {en: "Already asked: the game closes and opens again.", it: "Già richiesto: il gioco si chiude e si riapre.", ja: "依頼済みです：ゲームを閉じて再び開きます。"}
club.msg_blank: {en: "The slot already holds a blank card: put it in (CARD) and the game makes a club.", it: "Nello slot c'è già una tessera vuota: inseriscila (CARD) e il gioco crea un club.", ja: "スロットには白紙のカードがあります。カードを入れる（CARD）とゲームがクラブを作ります。"}
club.msg_arm_fix: {en: "Click again: the bad endings go back to 0, the game restarts.", it: "Clicca di nuovo: le chiusure anomale tornano a 0, il gioco si riavvia.", ja: "もう一度押すと異常終了が0に戻り、ゲームが再起動します。"}
club.msg_arm_new: {en: "Click again: this club goes to YOUR CARDS, a new card into the slot.", it: "Clicca di nuovo: questo club va in LE TUE TESSERE, una nuova tessera nello slot.", ja: "もう一度押すと、このクラブは「あなたのカード」へ、新しいカードがスロットへ入ります。"}
club.msg_arm_play: {en: "Click again to play %{club}: the game restarts with it.", it: "Clicca di nuovo per giocare con %{club}: il gioco si riavvia con questo club.", ja: "もう一度押すと%{club}でプレイします。ゲームが再起動します。"}
club.msg_switching: {en: "Switching: the game closes and opens again (about a minute).", it: "Cambio in corso: il gioco si chiude e si riapre (circa un minuto).", ja: "切り替え中：ゲームを閉じて再び開きます（約1分）。"}
club.msg_fixing: {en: "Clearing the bad endings: the game closes and opens again.", it: "Azzeramento delle chiusure anomale: il gioco si chiude e si riapre.", ja: "異常終了をクリア中：ゲームを閉じて再び開きます。"}
club.msg_restart_failed: {en: "Could not ask for the restart: close the game, then Launcher.exe does the switch.", it: "Impossibile chiedere il riavvio: chiudi il gioco, poi Launcher.exe fa il cambio.", ja: "再起動を依頼できませんでした。ゲームを閉じると Launcher.exe が切り替えます。"}
