# messages: the status line, the questions, the output; the run's own lines stay English
launcher.msg_starting: {en: "Starting the game - about 30 seconds ...", it: "Avvio del gioco - circa 30 secondi ...", ja: "ゲームを起動しています（約 30 秒）..."}
launcher.msg_restarting: {en: "Restarting, as SETTINGS asked ...", it: "Riavvio, come richiesto da SETTINGS ...", ja: "SETTINGS の指示で再起動しています..."}
launcher.msg_stopping: {en: "Stopping the game ...", it: "Arresto del gioco ...", ja: "ゲームを終了しています..."}
launcher.msg_running: {en: "The game is running. Close its window to quit (STOP THE GAME if it is stuck).", it: "Il gioco è in esecuzione. Chiudi la sua finestra per uscire (FERMA IL GIOCO se è bloccato).", ja: "ゲームは実行中です。終了するにはゲームのウィンドウを閉じてください（固まった場合は「ゲームを終了」）。"}
launcher.msg_bad_address: {en: "Type the server's address: four numbers with dots, e.g. 192.168.1.20.", it: "Scrivi l'indirizzo del server: quattro numeri separati da punti, ad es. 192.168.1.20.", ja: "サーバーのアドレスを入力してください（ドットで区切った 4 つの数字、例: 192.168.1.20）。"}
launcher.msg_start_failed: {en: "The game did not start - OUTPUT below says why.", it: "Il gioco non è partito - il motivo è nell'OUTPUT qui sotto.", ja: "ゲームを起動できませんでした（理由は下の「出力」にあります）。"}
launcher.msg_browse_title: {en: "Pick the game folder (the one with client_Release.exe)", it: "Scegli la cartella del gioco (quella con client_Release.exe)", ja: "ゲームフォルダー（client_Release.exe があるフォルダー）を選んでください"}
launcher.msg_undo_confirm: {en: "Put the game folder back the way it was before setup?", it: "Riportare la cartella del gioco com'era prima della configurazione?", ja: "ゲームフォルダーをセットアップ前の状態に戻しますか？"}
launcher.msg_no_folder: {en: "Pick the game folder first (the one with client_Release.exe).", it: "Scegli prima la cartella del gioco (quella con client_Release.exe).", ja: "先にゲームフォルダー（client_Release.exe があるフォルダー）を選んでください。"}
launcher.msg_not_known: {en: "not known", it: "sconosciuta", ja: "不明"}
launcher.msg_available: {en: "A newer version is out: %{tag}. Open UPDATE below to get it.", it: "È uscita una versione più recente: %{tag}. Apri AGGIORNAMENTO qui sotto per averla.", ja: "新しいバージョンが公開されています: %{tag}。下の「アップデート」から入手できます。"}
launcher.msg_asking: {en: "Looking for updates ...", it: "Ricerca degli aggiornamenti ...", ja: "更新を確認しています..."}
launcher.msg_pick: {en: "Pick a version, then UPDATE. \"What's new\" opens its page.", it: "Scegli una versione, poi AGGIORNA. \"Novità\" apre la sua pagina.", ja: "バージョンを選んで「アップデート」を押してください。「更新内容」でそのページを開きます。"}
launcher.msg_none_listed: {en: "No update found.", it: "Nessun aggiornamento trovato.", ja: "更新は見つかりませんでした。"}
launcher.msg_no_answer: {en: "The update server did not answer: %{error}. Close Launcher and open it again to retry.", it: "Il server degli aggiornamenti non ha risposto: %{error}. Chiudi Launcher e riaprilo per riprovare.", ja: "更新サーバーから応答がありません: %{error}。Launcher を閉じて、もう一度開いてください。"}
launcher.msg_confirm_release: {en: "Put the release %{tag} into this Forza-WCCF folder?\n\nYour club cards, keys and settings (data) are kept. Close the game first.", it: "Mettere la versione %{tag} in questa cartella di Forza-WCCF?\n\nLe tue carte club, i tasti e le impostazioni (data) restano. Chiudi prima il gioco.", ja: "リリース %{tag} をこの Forza-WCCF フォルダーに入れますか？\n\nクラブカード、キー、設定（data）はそのまま残ります。先にゲームを閉じてください。"}
launcher.msg_confirm_test: {en: "Put the test build %{tag} into this Forza-WCCF folder?\n\nYour club cards, keys and settings (data) are kept. Close the game first.", it: "Mettere la versione di prova %{tag} in questa cartella di Forza-WCCF?\n\nLe tue carte club, i tasti e le impostazioni (data) restano. Chiudi prima il gioco.", ja: "テスト版 %{tag} をこの Forza-WCCF フォルダーに入れますか？\n\nクラブカード、キー、設定（data）はそのまま残ります。先にゲームを閉じてください。"}
launcher.msg_downloading: {en: "Downloading %{tag} ...", it: "Download di %{tag} ...", ja: "%{tag} をダウンロードしています..."}
launcher.msg_unzipping: {en: "Unzipping ...", it: "Estrazione ...", ja: "展開しています..."}
launcher.msg_copying: {en: "Copying %{tag} into the Forza-WCCF folder ...", it: "Copia di %{tag} nella cartella di Forza-WCCF ...", ja: "%{tag} を Forza-WCCF フォルダーにコピーしています..."}
launcher.msg_updated: {en: "This Forza-WCCF folder now holds %{tag}.", it: "Questa cartella di Forza-WCCF ora contiene %{tag}.", ja: "この Forza-WCCF フォルダーは %{tag} になりました。"}
launcher.msg_after_update: {en: "Forza-WCCF is updated.\n\nSet up the game folder for the new version now?", it: "Forza-WCCF è aggiornato.\n\nConfigurare ora la cartella del gioco per la nuova versione?", ja: "Forza-WCCF を更新しました。\n\n新しいバージョン用にゲームフォルダーをセットアップしますか？"}
launcher.msg_after_update_english: {en: "Forza-WCCF is updated.\n\nSet up the game folder for the new version now, and put its English in?", it: "Forza-WCCF è aggiornato.\n\nConfigurare ora la cartella del gioco per la nuova versione e rimettere l'inglese?", ja: "Forza-WCCF を更新しました。\n\n新しいバージョン用にゲームフォルダーをセットアップし、英語化もやり直しますか？"}
launcher.msg_after_update_italian: {en: "Forza-WCCF is updated.\n\nSet up the game folder for the new version now, and put its Italian in?", it: "Forza-WCCF è aggiornato.\n\nConfigurare ora la cartella del gioco per la nuova versione e rimettere l'italiano?", ja: "Forza-WCCF を更新しました。\n\n新しいバージョン用にゲームフォルダーをセットアップし、イタリア語化もやり直しますか？"}
launcher.msg_close_game: {en: "Close the game first: %{name} runs from the Forza-WCCF folder.", it: "Chiudi prima il gioco: %{name} è in esecuzione dalla cartella di Forza-WCCF.", ja: "先にゲームを閉じてください: %{name} が Forza-WCCF フォルダーから実行されています。"}
launcher.msg_download_failed: {en: "The download failed: %{error}", it: "Download non riuscito: %{error}", ja: "ダウンロードに失敗しました: %{error}"}
launcher.msg_unzip_failed: {en: "The ZIP did not unzip: %{error}", it: "Impossibile estrarre lo ZIP: %{error}", ja: "ZIP を展開できませんでした: %{error}"}
launcher.msg_not_a_kit: {en: "This ZIP is not a Forza-WCCF release: no folder in it holds Launcher.exe.", it: "Questo ZIP non è una versione di Forza-WCCF: nessuna sua cartella contiene Launcher.exe.", ja: "この ZIP は Forza-WCCF のリリースではありません（Launcher.exe を含むフォルダーがありません）。"}
launcher.msg_write_failed: {en: "%{path}: could not write it (%{error}) - close the game and try again.", it: "%{path}: scrittura non riuscita (%{error}) - chiudi il gioco e riprova.", ja: "%{path} に書き込めませんでした（%{error}）。ゲームを閉じて、もう一度お試しください。"}
launcher.msg_done: {en: "Done.", it: "Fatto.", ja: "完了しました。"}
launcher.msg_failed: {en: "Failed - OUTPUT below says why.", it: "Non riuscito - il motivo è nell'OUTPUT qui sotto.", ja: "失敗しました（理由は下の「出力」にあります）。"}
launcher.msg_busy: {en: "Wait: Launcher is busy.", it: "Attendi: Launcher è occupato.", ja: "処理中です。終わるまでお待ちください。"}
launcher.msg_unguarded: {en: "NOT started: Windows was told to load only its own copies of system files for programs started from here (\"Prefer System32 images\" - a WSL terminal does this), so the game would run without Forza-WCCF's guard. Start Launcher.exe from Explorer (double-click it).", it: "NON avviato: Windows ha ricevuto l'ordine di caricare solo le proprie copie dei file di sistema per i programmi avviati da qui (\"Prefer System32 images\" - lo fa un terminale WSL), quindi il gioco girerebbe senza la protezione di Forza-WCCF. Avvia Launcher.exe da Esplora file (doppio clic).", ja: "起動しませんでした: ここから起動するプログラムは Windows 自身のシステムファイルだけを読み込むよう指示されています（\"Prefer System32 images\" - WSL のターミナルがこれを行います）。このままでは Forza-WCCF の保護なしでゲームが動きます。エクスプローラーから Launcher.exe を起動してください（ダブルクリック）。"}
launcher.msg_not_guarded: {en: "NOT started: the 2017-18 network guard is not in place (setup-hashes.json is missing or does not match, or a game program is not the guarded copy), so the game could change this PC's network settings. Press SET UP under SETUP, then start again. The details are in Launcher's window.", it: "NON avviato: la protezione di rete del 2017-18 non è a posto (setup-hashes.json manca o non corrisponde, oppure un programma del gioco non è la copia protetta), quindi il gioco potrebbe cambiare le impostazioni di rete di questo PC. Premi CONFIGURA in CONFIGURAZIONE, poi riavvia. I dettagli sono nella finestra di Launcher.", ja: "起動しませんでした: 2017-18 のネットワーク保護が整っていません（setup-hashes.json がないか一致しない、またはゲームのプログラムが保護済みのコピーではありません）。このままではゲームがこの PC のネットワーク設定を変えるおそれがあります。「セットアップ」の「設定する」をもう一度押してから起動してください。詳細は Launcher のウィンドウにあります。"}
launcher.msg_online_1718: {en: "Online play for 2017-18 is not ready yet. Play on this PC.", it: "Il gioco online per il 2017-18 non è ancora pronto. Gioca su questo PC.", ja: "2017-18 のオンラインプレイはまだ準備できていません。このPCで遊んでください。"}
launcher.msg_stop_anyway: {en: "Your club card is in the reader, or a match is on: stopping now can give the card a bad ending (trade rights are lost at 2). The details are in Launcher's window.\n\nStop the game anyway?", it: "La tua carta del club è nel lettore, oppure è in corso una partita: fermare adesso può dare alla carta un finale negativo (a 2 si perdono i diritti di scambio). I dettagli sono nella finestra di Launcher.\n\nFermare comunque il gioco?", ja: "クラブカードがリーダーに入っているか、試合中です。今終了するとカードにバッドエンドが付くことがあります（2 回でトレード権を失います）。詳細は Launcher のウィンドウにあります。\n\nそれでもゲームを終了しますか？"}
launcher.msg_link_taken: {en: "This folder's path has special characters, which the game may not handle, and %{path} is already used by another Forza-WCCF folder. Running from here. If the game does not start, move the Forza-WCCF folder to a plain path such as C:\\Games.", it: "Il percorso di questa cartella ha caratteri speciali che il gioco potrebbe non gestire, e %{path} è già usata da un'altra cartella Forza-WCCF. Avvio da qui. Se il gioco non parte, sposta la cartella di Forza-WCCF in un percorso semplice come C:\\Games.", ja: "このフォルダーのパスには、ゲームが扱えないかもしれない特殊な文字があり、%{path} は別の Forza-WCCF フォルダーが使用中です。ここから起動します。ゲームが起動しない場合は、Forza-WCCF フォルダーを C:\\Games のような英数字だけのパスへ移動してください。"}
launcher.msg_link_no_junction: {en: "This folder's path has special characters, which the game may not handle, and Windows can only link folders on local NTFS drives. Running from here. If the game does not start, move the Forza-WCCF folder to a plain path such as C:\\Games.", it: "Il percorso di questa cartella ha caratteri speciali che il gioco potrebbe non gestire, e Windows può collegare solo cartelle su dischi NTFS locali. Avvio da qui. Se il gioco non parte, sposta la cartella di Forza-WCCF in un percorso semplice come C:\\Games.", ja: "このフォルダーのパスには、ゲームが扱えないかもしれない特殊な文字があり、Windows がリンクできるのはローカルの NTFS ドライブ上のフォルダーだけです。ここから起動します。ゲームが起動しない場合は、Forza-WCCF フォルダーを C:\\Games のような英数字だけのパスへ移動してください。"}
launcher.msg_link_failed: {en: "This folder's path has special characters, which the game may not handle, and linking it to %{path} failed (%{error}). Running from here. If the game does not start, move the Forza-WCCF folder to a plain path such as C:\\Games.", it: "Il percorso di questa cartella ha caratteri speciali che il gioco potrebbe non gestire, e il collegamento a %{path} non è riuscito (%{error}). Avvio da qui. Se il gioco non parte, sposta la cartella di Forza-WCCF in un percorso semplice come C:\\Games.", ja: "このフォルダーのパスには、ゲームが扱えないかもしれない特殊な文字があり、%{path} へのリンクに失敗しました（%{error}）。ここから起動します。ゲームが起動しない場合は、Forza-WCCF フォルダーを C:\\Games のような英数字だけのパスへ移動してください。"}
launcher.msg_pack_title: {en: "Pick the high-quality card pack (forza-wccf-cards-*.zip)", it: "Scegli il pacchetto di immagini carte in alta qualità (forza-wccf-cards-*.zip)", ja: "高画質カード画像パックを選んでください（forza-wccf-cards-*.zip）"}
launcher.msg_making_pictures: {en: "Making the card pictures ... (about a minute)", it: "Creo le immagini delle carte ... (circa un minuto)", ja: "カード画像を作成中...（約1分）"}
launcher.msg_no_fonts: {en: "Launcher cannot open its window: the fonts folder is missing or damaged (%{error}). Install Forza-WCCF again.", it: "Launcher non riesce ad aprire la finestra: la cartella fonts manca o è danneggiata (%{error}). Installa di nuovo Forza-WCCF.", ja: "Launcher のウィンドウを開けません: fonts フォルダーがないか壊れています（%{error}）。Forza-WCCF をもう一度インストールしてください。"}
launcher.msg_no_window: {en: "Launcher cannot open its window: %{error}", it: "Launcher non riesce ad aprire la finestra: %{error}", ja: "Launcher のウィンドウを開けません: %{error}"}

