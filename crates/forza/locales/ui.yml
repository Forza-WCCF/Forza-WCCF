launcher.msg_not_guarded: {en: "NOT started: the 2017-18 network protection is not in place. Press SET UP under SETUP, then start again.", it: "NON avviato: la protezione di rete del 2017-18 non è attiva. Premi CONFIGURA in CONFIGURAZIONE, poi riavvia.", ja: "起動しませんでした：2017-18 のネットワーク保護が有効ではありません。「セットアップ」の「設定する」を押してから起動してください。"}
launcher.msg_rooms_full: {en: "The server has no room left for a VS room. Try again in a minute.", it: "Il server non ha più posto per una sfida VS. Riprova tra un minuto.", ja: "サーバーに対戦ルームの空きがありません。1分後にもう一度お試しください。"}
launcher.msg_bad_club: {en: "Type the club server as HOST or HOST:PORT (default port 20060), or leave it empty to use the chosen server.", it: "Scrivi il server dei club come HOST o HOST:PORTA (porta predefinita 20060), oppure lascia vuoto per usare il server scelto.", ja: "クラブサーバーを HOST または HOST:PORT（既定のポートは 20060）で入力してください。空欄なら選んだサーバーを使います。"}
launcher.msg_stop_anyway: {en: "A club card is in or a match is on. Stopping now can damage the card (2 bad endings lose its trade rights).\n\nStop the game anyway?", it: "Una carta club è inserita o c'è una partita in corso. Fermare ora può danneggiare la carta (a 2 chiusure anomale si perdono i diritti di scambio).\n\nFermare comunque il gioco?", ja: "クラブカードが入っているか、試合中です。今終了するとカードに悪影響が出ることがあります（異常終了が 2 回でトレード権を失います）。\n\nそれでもゲームを終了しますか？"}
launcher.msg_link_taken: {en: "The folder path has special characters the game may not handle (%{path} is already in use). If the game does not start, move this folder to a plain path such as C:\\Games.", it: "Il percorso della cartella ha caratteri speciali che il gioco potrebbe non gestire (%{path} è già in uso). Se il gioco non parte, sposta la cartella in un percorso semplice come C:\\Games.", ja: "フォルダーのパスにゲームが扱えない可能性のある特殊な文字があります（%{path} は使用中）。ゲームが起動しない場合は、C:\\Games のような英数字だけのパスへ移動してください。"}
launcher.msg_link_no_junction: {en: "The folder path has special characters the game may not handle (the drive is not local NTFS). If the game does not start, move this folder to a plain path such as C:\\Games.", it: "Il percorso della cartella ha caratteri speciali che il gioco potrebbe non gestire (il disco non è NTFS locale). Se il gioco non parte, sposta la cartella in un percorso semplice come C:\\Games.", ja: "フォルダーのパスにゲームが扱えない可能性のある特殊な文字があります（ローカルの NTFS ドライブではありません）。ゲームが起動しない場合は、C:\\Games のような英数字だけのパスへ移動してください。"}
launcher.msg_link_failed: {en: "The folder path has special characters the game may not handle (link to %{path} failed: %{error}). If the game does not start, move this folder to a plain path such as C:\\Games.", it: "Il percorso della cartella ha caratteri speciali che il gioco potrebbe non gestire (collegamento a %{path} non riuscito: %{error}). Se il gioco non parte, sposta la cartella in un percorso semplice come C:\\Games.", ja: "フォルダーのパスにゲームが扱えない可能性のある特殊な文字があります（%{path} へのリンクに失敗：%{error}）。ゲームが起動しない場合は、C:\\Games のような英数字だけのパスへ移動してください。"}
launcher.msg_pack_title: {en: "Pick the high-quality card pack (forza-wccf-cards-*.zip)", it: "Scegli il pacchetto di immagini carte in alta qualità (forza-wccf-cards-*.zip)", ja: "高画質カード画像パックを選んでください（forza-wccf-cards-*.zip）"}
launcher.msg_making_pictures: {en: "Making card pictures ...", it: "Creo le immagini delle carte ...", ja: "カード画像を作成中..."}
launcher.msg_no_fonts: {en: "Launcher cannot start: the fonts folder is missing or damaged (%{error}). Reinstall Forza-WCCF.", it: "Launcher non si avvia: la cartella fonts manca o è danneggiata (%{error}). Reinstalla Forza-WCCF.", ja: "Launcher を開始できません：fonts フォルダーがないか壊れています（%{error}）。Forza-WCCF を再インストールしてください。"}
