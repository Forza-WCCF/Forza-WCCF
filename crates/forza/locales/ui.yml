club.msg_arm_new: {en: "Click again: this club goes to YOUR CARDS, a new card into the slot.", it: "Clicca di nuovo: questo club va in LE TUE TESSERE, una nuova tessera nello slot.", ja: "もう一度押すと、このクラブは「あなたのカード」へ、新しいカードがスロットへ入ります。"}
