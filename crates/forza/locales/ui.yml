club.msg_switching: {en: "Switching: the game closes and opens again (about a minute).", it: "Cambio in corso: il gioco si chiude e si riapre (circa un minuto).", ja: "切り替え中：ゲームを閉じて再び開きます（約1分）。"}
club.msg_fixing: {en: "Clearing the bad endings: the game closes and opens again.", it: "Azzeramento delle chiusure anomale: il gioco si chiude e si riapre.", ja: "異常終了をクリア中：ゲームを閉じて再び開きます。"}
club.msg_restart_failed: {en: "Could not ask for the restart: close the game, then Launcher.exe does the switch.", it: "Impossibile chiedere il riavvio: chiudi il gioco, poi Launcher.exe fa il cambio.", ja: "再起動を依頼できませんでした。ゲームを閉じると Launcher.exe が切り替えます。"}
