name: Bug report
description: Something does not work.
labels: [bug]
projects: [Forza-WCCF/1]
body:
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: [2017-18, 2010-11, Both]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the Launcher, for example 0.5.0.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did before it happened.
  - type: markdown
    attributes:
      value: Press SAVE LOGS in the Launcher, then attach the ZIP from your Downloads folder below.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag the SAVE LOGS ZIP here.
