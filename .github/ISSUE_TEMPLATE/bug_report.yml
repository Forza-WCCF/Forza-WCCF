name: Installer bug
# No media or key uploads are needed to diagnose the installer.
description: Report a build, wizard or extraction problem
body:
  - type: markdown
    attributes:
      value: Do not attach disc images, key files, game binaries or saves. Redact personal paths and identifiers from logs.
  - type: input
    id: version
    attributes:
      label: Installer version
      description: Release tag or commit; use --version for a release binary.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Windows version and game image
      placeholder: Windows 11 x64; SBWG Rev D or SDDY 2.00.00 (no download links)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error text and last successful step
    validations:
      required: true
