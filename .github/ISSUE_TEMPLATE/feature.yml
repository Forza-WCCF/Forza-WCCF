name: Feature request
description: Ask for something new or a change.
labels: [feature]
projects: [Forza-WCCF/1]
body:
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: [2017-18, 2010-11, Both]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you want
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would help you do.
