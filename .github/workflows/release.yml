name: Release

# A tag v<workspace version> builds the installer ZIP and the 2017-18 ZIP and opens a DRAFT pre-release.
# A maintainer publishes it after someone has played the build.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_XWIN_VERSION: "0.23.1"
  CARGO_XWIN_SHA256: c492c6dfb7e5ac0eee586b796e0fc950ba13077e7f0bbb046f445d71790d5360

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: rust:1.99-trixie
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang clang-19 clang-tools-19 lld lld-19 llvm llvm-19 ca-certificates curl
          curl -fsSL -o /tmp/cx.tgz "https://github.com/rust-cross/cargo-xwin/releases/download/v${CARGO_XWIN_VERSION}/cargo-xwin-v${CARGO_XWIN_VERSION}.x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_XWIN_SHA256}  /tmp/cx.tgz" | sha256sum -c -
          tar -xzf /tmp/cx.tgz -C /usr/local/bin cargo-xwin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: The tag is v + the workspace version
        run: |
          V=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)
          [ -n "$V" ] || { echo "::error::no workspace version"; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$V"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Packages
        run: |
          cargo xtask package 2017-18 --name "Forza-WCCF-2017-18-$V"
          cargo xtask package installer
          cd dist && ls | grep -vx SHA256SUMS.txt | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" --draft --prerelease --verify-tag \
            --title "$TAG" --notes "Draft: play the build before publishing. SHA-256 sums: SHA256SUMS.txt." dist/*
