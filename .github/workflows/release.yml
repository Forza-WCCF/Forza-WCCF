name: Release

# A tag v<version> builds the installer ZIP and the 2017-18 ZIP, checks them on VirusTotal and opens a DRAFT
# pre-release. A maintainer publishes it after someone has played the build. Run by hand (workflow_dispatch) it is a
# dry run: build and VirusTotal, no release. The version comes from the tag (cargo xtask: `git describe`), no commit
# bumps it: v0.6.1 -> version.txt kit-0.6.1, the programs' version information and the file names.
# A release candidate is a dispatch with `version` (on the `next` branch): its files already carry that version, and
# the tag run on the same commit takes the candidate's files instead of building again (job candidate) and checks
# them (publish, "Same bytes as the candidate"). A tag without a candidate builds as a dispatch does, and publish
# stops there: no draft without a played candidate.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release candidate version, e.g. 0.7.0 (empty = the version from git describe)
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag push on a commit with a candidate: the candidate's `dist`, checked against its SHA256SUMS.txt and the tag's
  # version, becomes this run's `dist`, and build and reproducibility (done in the candidate run) are skipped. That saves
  # the ~40 minute build of the same bytes. virustotal and publish run on it as on a build.
  candidate:
    name: candidate
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Find and check the candidate
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V=${GITHUB_REF_NAME#v}
          rc=0
          cand=$(.github/scripts/candidate.sh find "$V" "$GITHUB_SHA") || rc=$?
          if [ "$rc" = 2 ]; then echo "::warning::no candidate for $V on $GITHUB_SHA: the tag is built"; exit 0; fi
          [ "$rc" = 0 ] || exit "$rc"
          .github/scripts/candidate.sh verify "cand-$cand" "$V"
          mv "cand-$cand" dist
          echo "run=$cand" >> "$GITHUB_OUTPUT"
          echo "### Files of candidate run [$cand](https://github.com/$REPO/actions/runs/$cand), not rebuilt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.find.outputs.run != ''
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

  build:
    name: build
    needs: candidate
    # a dispatch (candidate skipped) or a tag without a candidate
    if: ${{ !cancelled() && needs.candidate.result != 'failure' && needs.candidate.outputs.run == '' }}
    # the same image as ci.yml's build-test; Git Bash runs the scripts below unchanged
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # empty on a tag push: cargo xtask then takes the tag; set, it wins over git (xtask/src/main.rs version())
      FORZA_VERSION: ${{ inputs.version }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tags and the history to them: cargo xtask takes the version from `git describe`
          fetch-depth: 0
          persist-credentials: false
      # only the pinned toolchain, as in ci.yml, so the cache key matches the one main saves
      - run: |
          rustup show
          a=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup toolchain list | cut -d' ' -f1 | grep -vx "$a" | xargs -r -n1 rustup toolchain uninstall
      # restore only: CI's build-test on main saves this cache (a tag build can read the default branch's caches)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
          save-if: false
      - name: The tag is v + a version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not v<semver>"; exit 1; }
          fi
          git describe --tags --long --match 'v[0-9]*.[0-9]*.[0-9]*' || echo "no tag: a 0.0.0-dev build"
          if [ -n "$FORZA_VERSION" ]; then echo "release candidate: FORZA_VERSION=$FORZA_VERSION"; fi
      - name: Build environment (what changed, when a file differs from the last release for no source reason)
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc -vV
          for d in "/c/Program Files/Microsoft Visual Studio"/*/*/VC/Tools/MSVC/* "/c/Program Files (x86)/Windows Kits/10/Lib"/*; do echo "$d"; done
      - name: Packages
        run: |
          cargo xtask package 2017-18
          cargo xtask package installer
          # a candidate's files carry its version, a tag's files the tag's (`git describe` found the tag itself)
          V=$(printf '%s' "$FORZA_VERSION" | tr -d '[:space:]')
          if [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = tag ]; then V=${GITHUB_REF_NAME#v}; fi
          if [ -n "$V" ]; then
            ls "dist/Forza-WCCF-2017-18-$V.zip" "dist/Forza-WCCF-Installer-$V-windows-x64.exe" || { echo "::error::the files do not carry $V"; exit 1; }
          fi
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > "$RUNNER_TEMP/sums"
          mv "$RUNNER_TEMP/sums" SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [ -n "$FORZA_VERSION" ]; then
            { echo "### Release candidate $FORZA_VERSION"; echo "Commit $GITHUB_SHA, artifact \`dist\` of run $GITHUB_RUN_ID."; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          # a candidate waits for its play test and its tag
          retention-days: 14
          if-no-files-found: error

  # An unchanged program keeps its hash, and with it its reputation with the antivirus engines. Lists the PE files that
  # differ from the last published release and says why. Informational: a source change is a good reason.
  reproducibility:
    name: reproducibility
    needs: build
    # explicit: a skipped candidate job (a dispatch) would skip this job too
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: PE files against the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          mkdir base
          gh release download "$BASE" -D base -p 'Forza-WCCF-2017-18-*.zip' -p 'Forza-WCCF-Installer-*.exe'
          .github/scripts/repro.sh hashes base > base.txt
          .github/scripts/repro.sh hashes dist > new.txt
          { echo "### PE files against $BASE"; .github/scripts/repro.sh why base.txt new.txt "$BASE" "$GITHUB_SHA"; } | tee -a "$GITHUB_STEP_SUMMARY"

  # Every ZIP and EXE uploaded to VirusTotal (they are public release files anyway). Microsoft's engine (what Windows
  # Defender uses) must find nothing: only that stops the release. Other engines flagging a file are a warning (their
  # false alarms are common). The results table goes to the job summary and the release notes.
  virustotal:
    name: virustotal
    needs: [candidate, build]
    # a fresh verdict also on a candidate's files: VirusTotal knows them, so no upload, only the polls
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.candidate.outputs.run != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$VT_API_KEY" ] || { echo "::error::the VT_API_KEY secret is missing"; exit 1; }
          api=https://www.virustotal.com/api/v3
          # no -f: a 404 is normal here (a file just uploaded, or one the API does not know yet) and the poll decides
          vt() { curl -sS --retry 3 --retry-all-errors -H "x-apikey: $VT_API_KEY" "$@"; }
          out=virustotal.md
          printf '| File | Microsoft | Engines flagging | Report |\n|---|---|---|---|\n' > "$out"
          # One poll of the file object, done when Microsoft has a verdict and the engine count stopped moving: one
          # poll every 20 s, up to 15 minutes, as the free API allows 4 requests a minute. Sets a, ms, bad, mst, engines.
          poll() {
            prev=-1; ms=; a=
            for _ in $(seq 1 45); do
              sleep 20
              a=$(vt "$api/files/$sha")
              n=$(jq -r '.data.attributes.last_analysis_stats | (.undetected + .malicious + .suspicious + .timeout) // 0' <<<"$a" 2>/dev/null || echo 0)
              ms=$(jq -r '.data.attributes.last_analysis_results.Microsoft.category // empty' <<<"$a" 2>/dev/null || true)
              if [ -n "$ms" ] && [ "$n" = "$prev" ]; then break; fi
              prev=$n
            done
            bad=$(jq -r '.data.attributes.last_analysis_stats.malicious + .data.attributes.last_analysis_stats.suspicious' <<<"$a" 2>/dev/null || echo 0)
            mst=$(jq -r '.data.attributes.last_analysis_results.Microsoft | .category + (if .result then " (" + .result + ")" else "" end)' <<<"$a" 2>/dev/null || true)
            engines=$(jq -r '[.data.attributes.last_analysis_results[] | select(.engine_name != "Microsoft") | select(.category == "malicious" or .category == "suspicious") | .engine_name + ": " + (.result // "?")] | join(", ")' <<<"$a" 2>/dev/null || true)
          }
          fail=0
          for f in dist/*.zip dist/*.exe; do
            [ -e "$f" ] || continue
            name=$(basename "$f"); sha=$(sha256sum "$f" | cut -d' ' -f1)
            # upload only when VirusTotal does not have the hash yet: a known file needs no upload, and the 4
            # requests a minute go to the polls
            if [ "$(vt "$api/files/$sha" | jq -r '.data.id // empty')" != "$sha" ]; then
              url=$api/files
              # over 32 MB the free API wants an upload URL
              if [ "$(stat -c%s "$f")" -gt 33554432 ]; then url=$(vt "$api/files/upload_url" | jq -r .data); fi
              if ! vt -F "file=@$f" "$url" | jq -e .data.id >/dev/null; then
                echo "::error::$name: the upload failed"; fail=1; continue
              fi
              echo "uploaded $name"
            fi
            # poll the file object, not /analyses/<id>: that id comes from the upload and 404s while the scan is
            # queued (the 0.6.0 run died there)
            poll
            if [ -z "$ms" ]; then echo "::error::$name: VirusTotal gave no Microsoft result"; echo "$a" | head -c 400; fail=1; continue; fi
            # A Microsoft hit is one engine's opinion of these bytes at this moment, and it moves: 0.6.0's FPR_Emu.exe
            # was flagged at 02:12 and undetected at 03:47 with the same sha256, Launcher.exe and forza_panel.dll
            # flipped within 1.5 h, and the same bytes gave different answers on a player's Defender minutes apart
            # (E:\wccf-builds\av-oracle-20261101\, av-bisect-20261101\RESULTS.md). So a hit buys one fresh analysis
            # before it stops the release: the free API allows it, and a rescan is the only self-service there is.
            if [ "$ms" = malicious ] || [ "$ms" = suspicious ]; then
              echo "::warning::$name: Microsoft said $mst; asking VirusTotal for a fresh analysis"
              vt -X POST "$api/files/$sha/analyse" >/dev/null || true
              poll
              if [ -n "$mst" ]; then echo "::warning::$name: the fresh analysis says $mst"; fi
            fi
            printf '| %s | %s | %s %s | [report](https://www.virustotal.com/gui/file/%s) |\n' "$name" "$mst" "$bad" "${engines:+($engines)}" "$sha" >> "$out"
            case "$mst" in
              malicious*|suspicious*) echo "::error::$name: Microsoft flags it: $mst"; fail=1 ;;
            esac
            if [ "$bad" -gt 0 ]; then echo "::warning::$name: $bad engine(s) flag it: $engines"; fi
          done
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: virustotal
          path: virustotal.md
          retention-days: 30
          if-no-files-found: ignore

  publish:
    name: publish
    needs: [build, virustotal]
    # a tag push only: a dispatch never publishes, also when it runs on a tag. virustotal passed on a build or on the
    # candidate's files (explicit: build is skipped when the candidate's files are taken)
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.virustotal.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      # first: checkout empties the workspace
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # A candidate was played (a dispatch with `version` on this commit): no draft from bytes that differ from it. The
      # newest completed candidate whose `dist` artifact carries the tag's version counts; with none, the release stops.
      # On the candidate's own files (job candidate) this checks the copy.
      - name: Same bytes as the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V=${GITHUB_REF_NAME#v}
          rc=0
          cand=$(.github/scripts/candidate.sh find "$V" "$GITHUB_SHA") || rc=$?
          if [ "$rc" != 0 ]; then
            echo "### Candidate: none found for $V on $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::no candidate with version=$V on $GITHUB_SHA (reasons above): dispatch the Release workflow with version=$V on this commit, play the build, then tag the played commit"
            exit 1
          fi
          url="https://github.com/$REPO/actions/runs/$cand"
          # "<hash> *<name>" (Git Bash) and "<hash>  <name>" pair on the name alone
          sums() { awk '{ name = $2; sub(/^\*/, "", name); print $1, name }' "$1" | sort -k2,2; }
          # file name, this build's sha256, the candidate's: every file whose hashes differ or that one side lacks
          differ=$(join -1 2 -2 2 -a 1 -a 2 -e missing -o 0,1.1,2.1 <(sums dist/SHA256SUMS.txt) <(sums "cand-$cand/SHA256SUMS.txt") | awk '$2 != $3 { print $1 }')
          if [ -z "$differ" ]; then
            echo "### Candidate: same bytes as run [$cand]($url)" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::the tag build matches candidate run $cand"
          else
            { echo "### Candidate: these files differ from run [$cand]($url)"; echo '```'; echo "$differ"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the tag build differs from the played candidate (run $cand): ${differ//$'\n'/ }"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: virustotal
          path: vt
      - name: Draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" --draft --prerelease --verify-tag \
            --title "$TAG" --notes-file <(printf 'Draft: play the build before publishing. SHA-256 sums: SHA256SUMS.txt.\n\n### VirusTotal\n\n'; cat vt/virustotal.md) dist/*
