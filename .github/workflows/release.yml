name: Release

# A tag v<workspace version> builds the installer ZIP and the 2017-18 ZIP, checks them on VirusTotal and opens a DRAFT
# pre-release. A maintainer publishes it after someone has played the build. Run by hand (workflow_dispatch) it is a
# dry run: build and VirusTotal, no release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_XWIN_VERSION: "0.23.1"
  CARGO_XWIN_SHA256: c492c6dfb7e5ac0eee586b796e0fc950ba13077e7f0bbb046f445d71790d5360
  # keep in step with XWIN_CRT_VERSION / XWIN_SDK_VERSION in xtask/src/main.rs and ci.yml (the xwin cache key)
  XWIN_CRT_VERSION: "14.44.17.14"
  XWIN_SDK_VERSION: "10.0.26100"

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: rust:1.99.0-trixie@sha256:81015672d6939b0265f09adf96d5de125482bb1330106076956b0518e74edc90
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang clang-19 clang-tools-19 lld lld-19 llvm llvm-19 ca-certificates curl zstd
          curl -fsSL -o /tmp/cx.tgz "https://github.com/rust-cross/cargo-xwin/releases/download/v${CARGO_XWIN_VERSION}/cargo-xwin-v${CARGO_XWIN_VERSION}.x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_XWIN_SHA256}  /tmp/cx.tgz" | sha256sum -c -
          tar -xzf /tmp/cx.tgz -C /usr/local/bin cargo-xwin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # restore only: main's CI run saves this cache (a tag build can read the default branch's caches)
      - name: xwin cache (MSVC CRT and Windows SDK)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin-xtask
          key: xwin-${{ env.XWIN_CRT_VERSION }}-${{ env.XWIN_SDK_VERSION }}-x86_x86_64
      - name: The tag is v + the workspace version
        run: |
          V=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)
          [ -n "$V" ] || { echo "::error::no workspace version"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$V"; exit 1; }
          fi
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Packages
        run: |
          cargo xtask package 2017-18 --name "Forza-WCCF-2017-18-$V"
          cargo xtask package installer
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > "$RUNNER_TEMP/sums"
          mv "$RUNNER_TEMP/sums" SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Every ZIP and EXE uploaded to VirusTotal (they are public release files anyway). Microsoft's engine (what Windows
  # Defender uses) must find nothing; three or more engines flagging a file also stop the release; fewer is a warning
  # (small engines' false alarms are common). The results table goes to the job summary and the release notes.
  virustotal:
    name: virustotal
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$VT_API_KEY" ] || { echo "::error::the VT_API_KEY secret is missing"; exit 1; }
          api=https://www.virustotal.com/api/v3
          vt() { curl -fsS --retry 3 -H "x-apikey: $VT_API_KEY" "$@"; }
          out=virustotal.md
          printf '| File | Microsoft | Engines flagging | Report |\n|---|---|---|---|\n' > "$out"
          fail=0
          for f in dist/*.zip dist/*.exe; do
            [ -e "$f" ] || continue
            name=$(basename "$f"); sha=$(sha256sum "$f" | cut -d' ' -f1)
            url=$api/files
            # over 32 MB the free API wants an upload URL
            if [ "$(stat -c%s "$f")" -gt 33554432 ]; then url=$(vt "$api/files/upload_url" | jq -r .data); fi
            id=$(vt -F "file=@$f" "$url" | jq -r .data.id)
            # the free API allows 4 requests a minute: one poll every 20 s, up to 15 minutes
            a=
            for _ in $(seq 1 45); do
              sleep 20
              a=$(vt "$api/analyses/$id")
              [ "$(jq -r .data.attributes.status <<<"$a")" = completed ] && break
            done
            [ "$(jq -r .data.attributes.status <<<"$a")" = completed ] || { echo "::error::$name: VirusTotal did not finish"; fail=1; continue; }
            bad=$(jq '.data.attributes.stats.malicious + .data.attributes.stats.suspicious' <<<"$a")
            ms=$(jq -r '.data.attributes.results.Microsoft | if . == null then "not run" else .category + (if .result then " (" + .result + ")" else "" end) end' <<<"$a")
            engines=$(jq -r '[.data.attributes.results[] | select(.category == "malicious" or .category == "suspicious") | .engine_name + ": " + (.result // "?")] | join(", ")' <<<"$a")
            printf '| %s | %s | %s %s | [report](https://www.virustotal.com/gui/file/%s) |\n' "$name" "$ms" "$bad" "${engines:+($engines)}" "$sha" >> "$out"
            case "$ms" in
              malicious*|suspicious*) echo "::error::$name: Microsoft flags it: $ms"; fail=1 ;;
            esac
            if [ "$bad" -ge 3 ]; then echo "::error::$name: $bad engines flag it: $engines"; fail=1
            elif [ "$bad" -gt 0 ]; then echo "::warning::$name: $bad engine(s) flag it: $engines"; fi
          done
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: virustotal
          path: virustotal.md
          retention-days: 30
          if-no-files-found: ignore

  publish:
    name: publish
    needs: [build, virustotal]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: virustotal
          path: vt
      - name: Draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" --draft --prerelease --verify-tag \
            --title "$TAG" --notes-file <(printf 'Draft: play the build before publishing. SHA-256 sums: SHA256SUMS.txt.\n\n### VirusTotal\n\n'; cat vt/virustotal.md) dist/*
