name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # keep in step with XWIN_CRT_VERSION / XWIN_SDK_VERSION in xtask/src/main.rs (the xwin cache key)
  XWIN_CRT_VERSION: "14.44.17.14"
  XWIN_SDK_VERSION: "10.0.26100"
  CARGO_XWIN_VERSION: "0.23.1"
  CARGO_XWIN_SHA256: c492c6dfb7e5ac0eee586b796e0fc950ba13077e7f0bbb046f445d71790d5360
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  # Docs-only changes (root *.md, docs/**) skip build, windows-tests and deny; lint (with `check text`) always runs.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.d.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ] || git diff --name-only "$BASE" HEAD | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: container image matches rust-toolchain.toml
        run: |
          V=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          for f in .github/workflows/ci.yml .github/workflows/release.yml; do
            grep -q "container: rust:$V-trixie@sha256:" "$f" || { echo "::error file=$f::container image is not rust:$V-trixie@sha256:..."; exit 1; }
          done
      - name: cargo xtask check text (publisher name and personal data scrub, script host, "kit" in player text)
        run: cargo xtask check text
      - name: shellcheck
        run: git ls-files -z '*.sh' ':!:legacy/' | xargs -0 shellcheck xtask/commit-msg xtask/winrun.sh
      - name: python compiles
        run: python3 -m py_compile crates/server/python/*.py deploy/linux/*.py
      - name: actionlint
        run: |
          curl -fsSL -o /tmp/al.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml
      - name: linux-host (its Linux code is not built by the Windows-target steps)
        run: |
          cargo clippy --locked -p linux-host --all-targets -- -D warnings
          cargo test --locked -p linux-host
      - name: commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for c in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            xtask/commit-msg "$RUNNER_TEMP/msg" || { echo "::error::commit $c"; exit 1; }
          done

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: rust:1.99.0-trixie@sha256:81015672d6939b0265f09adf96d5de125482bb1330106076956b0518e74edc90
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang clang-19 clang-tools-19 lld lld-19 llvm llvm-19 ca-certificates curl zstd
          curl -fsSL -o /tmp/cx.tgz "https://github.com/rust-cross/cargo-xwin/releases/download/v${CARGO_XWIN_VERSION}/cargo-xwin-v${CARGO_XWIN_VERSION}.x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_XWIN_SHA256}  /tmp/cx.tgz" | sha256sum -c -
          tar -xzf /tmp/cx.tgz -C /usr/local/bin cargo-xwin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # only main saves the xwin cache; pull requests restore it (a PR's own cache is never read by main)
      - name: xwin cache (MSVC CRT and Windows SDK)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin-xtask
          key: xwin-${{ env.XWIN_CRT_VERSION }}-${{ env.XWIN_SDK_VERSION }}-x86_x86_64
      - name: xwin cache (restore only)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin-xtask
          key: xwin-${{ env.XWIN_CRT_VERSION }}-${{ env.XWIN_SDK_VERSION }}-x86_x86_64
      - name: cargo xtask check ci
        run: cargo xtask check ci
      - name: kit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit
          path: |
            target/kit/**
            target/x86_64-pc-windows-msvc/release/wccf-installer.exe
          retention-days: 3
          if-no-files-found: error

  windows-tests:
    name: windows-tests
    needs: build
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: target
      - name: cargo test (the GPU snapshot tests run in their own step)
        run: 'cargo test --locked --workspace --target x86_64-pc-windows-msvc --no-fail-fast -- --skip snapshots::'
      - name: cargo xtask check win
        run: cargo xtask check win
      - name: snapshots (informational, the runner has no GPU)
        continue-on-error: true
        run: 'cargo test --locked -p forza --test it --target x86_64-pc-windows-msvc -- snapshots::'
      - name: snapshot differences
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-diffs
          path: |
            crates/forza/tests/snapshots/*.diff.png
            crates/forza/tests/snapshots/*.new.png
          retention-days: 3
          if-no-files-found: ignore

  deny:
    name: deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  # One check to require in the ruleset: fails when any job failed or was cancelled; skipped jobs (docs-only changes) pass.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, build, windows-tests, deny]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: all jobs passed or were skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a CI job failed or was cancelled"
          exit 1
