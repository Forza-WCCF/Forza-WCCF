name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # weekly on main: keeps the caches alive (GitHub drops a cache after 7 days unused) and catches new problems
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # keep in step with XWIN_CRT_VERSION / XWIN_SDK_VERSION in xtask/src/main.rs (the xwin cache key)
  XWIN_CRT_VERSION: "14.44.17.14"
  XWIN_SDK_VERSION: "10.0.26100"
  CARGO_XWIN_VERSION: "0.23.1"
  CARGO_XWIN_SHA256: c492c6dfb7e5ac0eee586b796e0fc950ba13077e7f0bbb046f445d71790d5360
  # the test programs are built once on Linux (test-build) and only run on Windows (windows-tests)
  NEXTEST_VERSION: "0.9.149"
  NEXTEST_LINUX_SHA256: 32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770
  NEXTEST_WINDOWS_SHA256: bf904b85c7c5c2a29c340053a8d9d8e8027ff0d55a2bf7cef7d23032f8166438
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  # Docs-only changes (root *.md, docs/**) skip build, test-build, windows-tests and deny; lint (with `check text`) always runs.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.d.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ] || git diff --name-only "$BASE" HEAD | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: container image matches rust-toolchain.toml
        run: |
          V=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          for f in .github/workflows/ci.yml .github/workflows/release.yml; do
            grep -q "container: rust:$V-trixie@sha256:" "$f" || { echo "::error file=$f::container image is not rust:$V-trixie@sha256:..."; exit 1; }
          done
      - name: cargo xtask check text (publisher name and personal data scrub, script host, "kit" in player text)
        run: cargo xtask check text
      - name: shellcheck
        run: git ls-files -z '*.sh' ':!:legacy/' | xargs -0 shellcheck xtask/commit-msg xtask/winrun.sh
      - name: python compiles
        run: python3 -m py_compile crates/server/python/*.py deploy/linux/*.py
      - name: actionlint
        run: |
          curl -fsSL -o /tmp/al.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml
      - name: linux-host (its Linux code is not built by the Windows-target steps)
        run: |
          cargo clippy --locked -p linux-host --all-targets -- -D warnings
          cargo test --locked -p linux-host
      - name: commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for c in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            xtask/commit-msg "$RUNNER_TEMP/msg" || { echo "::error::commit $c"; exit 1; }
          done

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: rust:1.99.0-trixie@sha256:81015672d6939b0265f09adf96d5de125482bb1330106076956b0518e74edc90
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang clang-19 clang-tools-19 lld lld-19 llvm llvm-19 ca-certificates curl zstd
          curl -fsSL -o /tmp/cx.tgz "https://github.com/rust-cross/cargo-xwin/releases/download/v${CARGO_XWIN_VERSION}/cargo-xwin-v${CARGO_XWIN_VERSION}.x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_XWIN_SHA256}  /tmp/cx.tgz" | sha256sum -c -
          tar -xzf /tmp/cx.tgz -C /usr/local/bin cargo-xwin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # only main saves the xwin cache; pull requests restore it (a PR's own cache is never read by main)
      - name: xwin cache (MSVC CRT and Windows SDK)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin-xtask
          key: xwin-${{ env.XWIN_CRT_VERSION }}-${{ env.XWIN_SDK_VERSION }}-x86_x86_64
      - name: xwin cache (restore only)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin-xtask
          key: xwin-${{ env.XWIN_CRT_VERSION }}-${{ env.XWIN_SDK_VERSION }}-x86_x86_64
      - name: cargo xtask check ci
        run: cargo xtask check ci
      # one zstd tarball instead of ~170 loose files: faster upload and download than the artifact's own zip
      - name: pack the kit
        run: tar --zstd -cf kit.tar.zst target/kit target/x86_64-pc-windows-msvc/release/wccf-installer.exe
      - name: kit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit
          path: kit.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  # the workspace's test programs, built beside `build` (not after it) with cargo-xwin, packed by cargo-nextest
  test-build:
    name: test-build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: rust:1.99.0-trixie@sha256:81015672d6939b0265f09adf96d5de125482bb1330106076956b0518e74edc90
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang clang-19 clang-tools-19 lld lld-19 llvm llvm-19 ca-certificates curl zstd
          curl -fsSL -o /tmp/cx.tgz "https://github.com/rust-cross/cargo-xwin/releases/download/v${CARGO_XWIN_VERSION}/cargo-xwin-v${CARGO_XWIN_VERSION}.x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_XWIN_SHA256}  /tmp/cx.tgz" | sha256sum -c -
          tar -xzf /tmp/cx.tgz -C /usr/local/bin cargo-xwin
          curl -fsSL -o /tmp/nt.tgz "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NEXTEST_LINUX_SHA256}  /tmp/nt.tgz" | sha256sum -c -
          tar -xzf /tmp/nt.tgz -C /usr/local/bin cargo-nextest
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # its own cache (rust-cache keys by job): the test profile shares nothing with build's release one
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # build saves the xwin cache on main; this job only reads it
      - name: xwin cache (restore only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin-xtask
          key: xwin-${{ env.XWIN_CRT_VERSION }}-${{ env.XWIN_SDK_VERSION }}-x86_x86_64
      # xtask's xwin settings (rust() in xtask/src/main.rs): its cache folder and both architectures, so the cache never flips
      - name: cargo nextest archive
        run: |
          export XWIN_ACCEPT_LICENSE=1 XWIN_CACHE_DIR="$HOME/.cache/cargo-xwin-xtask" XWIN_ARCH=x86,x86_64
          eval "$(cargo xwin env --target x86_64-pc-windows-msvc)"
          cargo nextest archive --locked --workspace --target x86_64-pc-windows-msvc --archive-file tests.tar.zst
      - name: tests artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests
          path: tests.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  windows-tests:
    name: windows-tests
    needs: [build, test-build]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # Defender deleted an old winmm.dll and flagged inject.exe and logowin.exe on players' PCs: the kits are scanned
      # here, and any detection while the tests run (behaviour monitoring included) fails the job
      - name: Defender status
        id: defender
        shell: pwsh
        run: |
          "start=$((Get-Date).ToUniversalTime().ToString('o'))" >> $env:GITHUB_OUTPUT
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { "::warning::Defender signature update failed (exit $LASTEXITCODE); scanning with the installed signatures" }
          Get-MpComputerStatus | Select-Object AMEngineVersion, AntivirusSignatureVersion, RealTimeProtectionEnabled, BehaviorMonitorEnabled, AntivirusEnabled | Format-List
      # the EICAR test file, from two halves so this file never holds the whole string: the scan must find it
      - name: Defender control (EICAR)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'eicar'
          New-Item -ItemType Directory -Force $d | Out-Null
          $f = Join-Path $d 'eicar.com'
          $a = 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR'
          $b = '-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'
          try { [IO.File]::WriteAllText($f, $a + $b) } catch { "real-time protection refused the write: $($_.Exception.Message)" }
          Start-Sleep -Seconds 2
          if (-not (Test-Path $f)) { "real-time protection removed the file: Defender is scanning"; exit 0 }
          $out = & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $f -DisableRemediation 2>&1 | Out-String
          $code = $LASTEXITCODE
          Remove-Item -Force $f -ErrorAction SilentlyContinue
          if ($code -ne 2) { $out; "::error::Defender is not scanning on this runner (EICAR scan exit $code, 2 expected)"; exit 1 }
          "EICAR found (exit 2): Defender is scanning"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # only xtask builds here (`check win`); a new key, so the old cache of the whole test build is not restored
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests
      - name: unpack the kit
        shell: bash
        run: tar --zstd -xf kit.tar.zst && rm kit.tar.zst
      - name: Defender scan of the kits and the installer
        shell: pwsh
        run: |
          $bad = 0
          foreach ($p in 'target\kit', 'target\x86_64-pc-windows-msvc\release\wccf-installer.exe') {
            $full = (Resolve-Path $p).Path
            $out = & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $full -DisableRemediation 2>&1 | Out-String
            $code = $LASTEXITCODE
            switch ($code) {
              0 { "${full}: clean" }
              2 { $out; "::error::Defender found a threat in $full"; $bad++ }
              default { $out; "::error::Defender scan of $full failed (exit $code)"; $bad++ }
            }
          }
          if ($bad) { exit 1 }
      - name: cargo-nextest
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nt.zip" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-pc-windows-msvc.zip"
          echo "${NEXTEST_WINDOWS_SHA256}  $RUNNER_TEMP/nt.zip" | sha256sum -c -
          unzip -o "$RUNNER_TEMP/nt.zip" cargo-nextest.exe -d "$RUNNER_TEMP/nextest"
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      # the runner's desktop is 1024x768; the panel tests open a 1440x900 game window and a 1200x700 projector
      - name: screen 1920x1080
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "screen $($b.Width)x$($b.Height)"
          if ($b.Width -lt 1600 -or $b.Height -lt 1000) { throw "screen still $($b.Width)x$($b.Height)" }
      - name: tests (the GPU snapshot tests run in their own step)
        run: cargo-nextest nextest run --archive-file tests.tar.zst --workspace-remap '${{ github.workspace }}' --no-fail-fast -E 'not test(/^snapshots::/)'
      - name: cargo xtask check win
        run: cargo xtask check win
      # one at a time: wgpu devices made in parallel crashed the test process (crates/forza/tests/it/snapshots.rs)
      - name: snapshots (informational, the runner has no GPU)
        continue-on-error: true
        run: cargo-nextest nextest run --archive-file tests.tar.zst --workspace-remap '${{ github.workspace }}' --no-fail-fast -j 1 -E 'test(/^snapshots::/)'
      # every detection since the job started, except the EICAR control
      - name: Defender detections during the job
        if: always() && steps.defender.outcome == 'success'
        shell: pwsh
        env:
          START: ${{ steps.defender.outputs.start }}
        run: |
          $start = [DateTimeOffset]::Parse($env:START).UtcDateTime
          $names = @{}
          Get-MpThreat | ForEach-Object { $names[[int64]$_.ThreatID] = $_.ThreatName }
          $eicar = Join-Path $env:RUNNER_TEMP 'eicar'
          $hits = @(Get-MpThreatDetection | Where-Object {
              $_.InitialDetectionTime.ToUniversalTime() -ge $start -and
              -not ($_.Resources | Where-Object { $_ -like "*$eicar*" }) -and
              $names[[int64]$_.ThreatID] -notlike '*EICAR*'
            })
          if (-not (Get-MpComputerStatus).RealTimeProtectionEnabled) {
            "::notice::real-time protection is off on this runner: behaviour detection during the tests was not checked"
          }
          if ($hits.Count -eq 0) { "no Defender detections since $start"; exit 0 }
          $hits | ForEach-Object {
            [pscustomobject]@{
              ThreatID    = $_.ThreatID
              ThreatName  = $names[[int64]$_.ThreatID]
              ProcessName = $_.ProcessName
              Resources   = $_.Resources -join '; '
            }
          } | Format-List
          "::error::Defender detected $($hits.Count) threat(s) during the job"
          exit 1
      - name: snapshot differences
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-diffs
          path: |
            crates/forza/tests/snapshots/*.diff.png
            crates/forza/tests/snapshots/*.new.png
          retention-days: 3
          if-no-files-found: ignore

  deny:
    name: deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  # One check to require in the ruleset: fails when any job failed or was cancelled; skipped jobs (docs-only changes) pass.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, build, test-build, windows-tests, deny]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: all jobs passed or were skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a CI job failed or was cancelled"
          exit 1
