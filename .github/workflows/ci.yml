name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # weekly on main: keeps the caches alive (GitHub drops a cache after 7 days unused) and catches new problems
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  # Docs-only changes (root *.md, docs/**) skip build-test and deny; lint (with `check text`) always runs.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.d.outputs.code }}
      ui: ${{ steps.d.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            echo ui=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          if printf '%s\n' "$files" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi
          # the GPU snapshot step (informational) runs when the UI crate changed, on main, on schedule and on dispatch
          if printf '%s\n' "$files" | grep -qE '^crates/forza-ui/'; then
            echo ui=true >> "$GITHUB_OUTPUT"
          else
            echo ui=false >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo xtask check text (publisher name and personal data scrub, script host, "kit" in player text)
        run: cargo xtask check text
      - name: shellcheck
        run: git ls-files -z '*.sh' ':!:legacy/' | xargs -0 shellcheck xtask/commit-msg
      - name: python compiles
        run: python3 -m py_compile crates/server/python/*.py deploy/linux/*.py
      - name: actionlint
        run: |
          curl -fsSL -o /tmp/al.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml
      - name: linux-host (its Linux code is not built by the Windows-target steps)
        run: |
          cargo clippy --locked -p linux-host --all-targets -- -D warnings
          cargo test --locked -p linux-host
      - name: commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          for c in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            xtask/commit-msg "$RUNNER_TEMP/msg" || { echo "::error::commit $c"; exit 1; }
          done
          # the squash merge turns the title into the commit on main
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/msg"
          xtask/commit-msg "$RUNNER_TEMP/msg" || { echo "::error::pull request title"; exit 1; }

  # Everything builds and runs natively: the kits, the C self-tests, the workspace tests and the installer smoke run
  # (`cargo xtask check ci`); then the kits are scanned
  build-test:
    name: build-test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # windows-latest, windows-2025 and windows-2025-vs2026 all serve the VS 2026 image today; pin the explicit label
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      # Defender deleted an old winmm.dll and flagged inject.exe and logowin.exe on players' PCs: the kits are scanned
      # here, and any detection while the tests run (behaviour monitoring included) fails the job
      - name: Defender status
        id: defender
        shell: pwsh
        run: |
          "start=$((Get-Date).ToUniversalTime().ToString('o'))" >> $env:GITHUB_OUTPUT
          # the signature update (about 30 s) runs in the background while the build compiles; the step before the kit
          # scan waits for it. The EICAR control and the tests' behaviour monitoring use the installed signatures.
          $p = Start-Process -FilePath "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -ArgumentList '-SignatureUpdate' -NoNewWindow -PassThru -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'sigupdate.log')
          "update_pid=$($p.Id)" >> $env:GITHUB_OUTPUT
          Get-MpComputerStatus | Select-Object AMEngineVersion, AntivirusSignatureVersion, RealTimeProtectionEnabled, BehaviorMonitorEnabled, AntivirusEnabled | Format-List
          exit 0
      # the EICAR test file, from two halves so this file never holds the whole string: the scan must find it
      - name: Defender control (EICAR)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'eicar'
          New-Item -ItemType Directory -Force $d | Out-Null
          $f = Join-Path $d 'eicar.com'
          $a = 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR'
          $b = '-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'
          try { [IO.File]::WriteAllText($f, $a + $b) } catch { "real-time protection refused the write: $($_.Exception.Message)" }
          Start-Sleep -Seconds 2
          if (-not (Test-Path $f)) { "real-time protection removed the file: Defender is scanning"; exit 0 }
          $out = & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $f -DisableRemediation 2>&1 | Out-String
          $code = $LASTEXITCODE
          Remove-Item -Force $f -ErrorAction SilentlyContinue
          if ($code -ne 2) { $out; "::error::Defender is not scanning on this runner (EICAR scan exit $code, 2 expected)"; exit 1 }
          "EICAR found (exit 2): Defender is scanning"
          # GitHub's pwsh wrapper would end the step with MpCmdRun's last exit code (2 = found, the wanted result)
          exit 0
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the build no longer pins the CRT and SDK as xwin did: the log records them
      - name: toolchain (rust-toolchain.toml installs 1.99.0 and both targets)
        shell: bash
        run: |
          rustup show
          # rust-cache keys on every installed toolchain, and the image's own stable changes from one image to the
          # next: keep only the pinned one, so the key is the same on every runner and in release.yml
          a=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup toolchain list | cut -d' ' -f1 | grep -vx "$a" | xargs -r -n1 rustup toolchain uninstall
          rustc -vV
          VSW="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          REQ=Microsoft.VisualStudio.Component.VC.Llvm.Clang
          "$VSW" -latest -products '*' -requires "$REQ" -property installationVersion
          VS=$(cygpath -u "$("$VSW" -latest -products '*' -requires "$REQ" -property installationPath)")
          ls "$VS/VC/Tools/MSVC"
          "$VS/VC/Tools/Llvm/x64/bin/clang-cl.exe" --version
          ls "/c/Program Files (x86)/Windows Kits/10/Include"
      # `cargo xtask check` runs the tests with cargo-nextest when it is installed; the action checks the download's hash
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.148
      # one cache for every Windows build (the shared key drops the job name from the key): main and pull requests
      # save it (also when a check fails, so the compiling is kept); a pull request starts from main's cache and
      # its later pushes from its own. release.yml's tag builds only restore it. Old entries fall out at 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
          cache-on-failure: true
      # the runner's desktop is 1024x768; the panel tests open a 1440x900 game window and a 1200x700 projector
      - name: screen 1920x1080
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "screen $($b.Width)x$($b.Height)"
          if ($b.Width -lt 1600 -or $b.Height -lt 1000) { throw "screen still $($b.Width)x$($b.Height)" }
      - name: cargo xtask check ci (the GPU snapshot tests run in their own step)
        run: cargo xtask check ci
      - name: Defender scan of the kits and the installer
        shell: pwsh
        env:
          UPDATE_PID: ${{ steps.defender.outputs.update_pid }}
        run: |
          # the signature update started in the first step: wait for it, then scan with the new signatures
          if ($env:UPDATE_PID) { Wait-Process -Id ([int]$env:UPDATE_PID) -Timeout 300 -ErrorAction SilentlyContinue }
          $log = Join-Path $env:RUNNER_TEMP 'sigupdate.log'
          if (Test-Path $log) { Get-Content $log }
          $age = (Get-Date) - (Get-MpComputerStatus).AntivirusSignatureLastUpdated
          if ($age.TotalDays -gt 2) { "::warning::Defender signatures are $([int]$age.TotalDays) days old; the signature update may have failed" }
          Get-MpComputerStatus | Select-Object AMEngineVersion, AntivirusSignatureVersion | Format-List
          $bad = 0
          foreach ($p in 'target\kit', 'target\x86_64-pc-windows-msvc\release\Forza-WCCF-Installer.exe') {
            $full = (Resolve-Path $p).Path
            $out = & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $full -DisableRemediation 2>&1 | Out-String
            $code = $LASTEXITCODE
            switch ($code) {
              0 { "${full}: clean" }
              2 { $out; "::error::Defender found a threat in $full"; $bad++ }
              default { $out; "::error::Defender scan of $full failed (exit $code)"; $bad++ }
            }
          }
          if ($bad) { exit 1 }
          exit 0
      # one at a time: wgpu devices made in parallel crashed the test process (crates/forza-ui/tests/it/snapshots.rs)
      - name: snapshots (informational, the runner has no GPU)
        if: github.event_name != 'pull_request' || needs.changes.outputs.ui == 'true'
        continue-on-error: true
        run: 'cargo test --locked -p forza-ui --test it --target x86_64-pc-windows-msvc -- snapshots:: --test-threads=1'
      # every detection since the job started, except the EICAR control
      - name: Defender detections during the job
        if: always() && steps.defender.outcome == 'success'
        shell: pwsh
        env:
          START: ${{ steps.defender.outputs.start }}
        run: |
          $start = [DateTimeOffset]::Parse($env:START).UtcDateTime
          $names = @{}
          Get-MpThreat | ForEach-Object { $names[[int64]$_.ThreatID] = $_.ThreatName }
          $eicar = Join-Path $env:RUNNER_TEMP 'eicar'
          $hits = @(Get-MpThreatDetection | Where-Object {
              $_.InitialDetectionTime.ToUniversalTime() -ge $start -and
              -not ($_.Resources | Where-Object { $_ -like "*$eicar*" }) -and
              $names[[int64]$_.ThreatID] -notlike '*EICAR*'
            })
          if (-not (Get-MpComputerStatus).RealTimeProtectionEnabled) {
            "::notice::real-time protection is off on this runner: behaviour detection during the tests was not checked"
          }
          if ($hits.Count -eq 0) { "no Defender detections since $start"; exit 0 }
          $hits | ForEach-Object {
            [pscustomobject]@{
              ThreatID    = $_.ThreatID
              ThreatName  = $names[[int64]$_.ThreatID]
              ProcessName = $_.ProcessName
              Resources   = $_.Resources -join '; '
            }
          } | Format-List
          "::error::Defender detected $($hits.Count) threat(s) during the job"
          exit 1
      - name: snapshot differences
        if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.ui == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-diffs
          path: |
            crates/forza-ui/tests/snapshots/*.diff.png
            crates/forza-ui/tests/snapshots/*.new.png
          retention-days: 3
          if-no-files-found: ignore
      - name: kit artifact (for testers)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit
          path: |
            target/kit/**
            target/x86_64-pc-windows-msvc/release/Forza-WCCF-Installer.exe
          retention-days: 3
          if-no-files-found: ignore

  deny:
    name: deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  # One check to require in the ruleset: fails when any job failed or was cancelled; skipped jobs (docs-only changes) pass.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, build-test, deny]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: all jobs passed or were skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a CI job failed or was cancelled"
          exit 1
