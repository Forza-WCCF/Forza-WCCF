name: CI

on:
  push:
    branches: [main]
    paths: &executable-paths
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  pull_request:
    paths: *executable-paths
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  windows:
    name: Windows x64 checks and package
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test (no game media or keys)
        run: cargo test --locked
      - name: Check dependency license notices
        run: ./scripts/check-licenses.ps1
      - name: Build Windows x64 release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Synthetic headless smoke check
        run: ./scripts/smoke.ps1
      - name: Package
        run: ./scripts/package.ps1
      - name: Upload installer bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64
          path: |
            dist/wccf-installer.exe
            dist/wccf-installer-*-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/README.md
            dist/CHANGELOG.md
            dist/LICENSE
            dist/THIRD-PARTY-LICENSES.json
          if-no-files-found: error
          retention-days: 14
