# The C runtime linked in (/MT): no Visual C++ runtime needed on the player's PC.
# /Brepro: no link timestamp, so the same source gives the same exe.
# /DEBUG:NONE: no PDB; a linker that hashes the PDB, with its absolute paths, into the /Brepro timestamp gives two files for two folders (lld-link did).
# /ignore:4099: the linker warns for every object of the CRT libraries whose PDB is not shipped.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/Brepro", "-C", "link-arg=/ignore:4099", "-C", "link-arg=/DEBUG:NONE"]

# rust-lld (the lld-link that ships with Rust), as every release up to 0.2.1 was linked: the first link.exe build of the
# installer was flagged by Microsoft's machine-learning engine (Trojan:Win32/Wacatac.C!ml, release dry run 2026-10-22).
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.i686-pc-windows-msvc]
linker = "rust-lld"

[alias]
xtask = "run -q -p xtask --"
