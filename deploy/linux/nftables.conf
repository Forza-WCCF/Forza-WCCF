#!/usr/sbin/nft -f
# /etc/nftables.conf for a Forza-WCCF server (docs/SELF-HOSTING.md, "Ports and firewall"): drop inbound except SSH and
# the game ports. Delete the lines of a piece you do not run. Flushes only this table, so other tables survive a reload.
table inet filter
flush table inet filter

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 20/second accept
		meta l4proto ipv6-icmp accept
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept
		tcp dport 22 accept

		# 2010-11: control 20002, seat desk 20030, projector relay 20031; capped per source so one client cannot
		# flood the single-threaded control
		tcp dport { 20002, 20030, 20031 } ct state new meter wccf_conn4 { ip saddr ct count over 16 } reject with tcp reset
		tcp dport { 20002, 20030, 20031 } ct state new meter wccf_rate4 { ip saddr limit rate over 10/second burst 20 packets } drop
		tcp dport { 20002, 20030, 20031 } accept
		# 2010-11: match relay
		udp dport 20040 accept
		# 2010-11: log inbox (SEND LOGS and the automatic crash reports of players on this server)
		tcp dport 20050 accept

		# 2017-18: desk + lobby 20032, game server 20060 (it serves only allow.txt), VS reflect UDP 20061
		tcp dport { 20032, 20060 } accept
		udp dport 20061 accept

		# iroh relay for 2017-18 direct VS: HTTPS relay TCP 8443, QUIC address discovery UDP 7842
		tcp dport 8443 accept
		udp dport 7842 accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
