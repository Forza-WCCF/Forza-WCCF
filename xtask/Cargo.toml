[package]
name = "xtask"
version = "0.5.1" # its own version, not the release number (docs/RELEASING.md)
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "cargo xtask build | check [quick] | package: the kit's build, checks and ZIP"

[dependencies]
anyhow.workspace = true
clap.workspace = true
fs-err.workspace = true
object.workspace = true
semver.workspace = true
serde_json.workspace = true
sha2.workspace = true
xshell.workspace = true
zip.workspace = true

# `verify`'s preflight: the running processes, "Prefer System32 images", the free space
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[lints]
workspace = true
# clippy::pedantic (deny, this crate only) is in src/main.rs: Cargo cannot combine `workspace = true` with the
# `priority = -1` that entry needs, and copying the workspace's lints here would let them drift

[dev-dependencies]
# the property tests of `mask` and `names_publisher`
proptest.workspace = true
