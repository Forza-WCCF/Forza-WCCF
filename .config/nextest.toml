# cargo-nextest runs each test in its own process, so the snapshot tests' in-process GPU lock no longer holds them apart:
# wgpu devices made in parallel crashed the test process (crates/forza-ui/tests/it/snapshots.rs). One at a time.
[test-groups]
gpu = { max-threads = 1 }

[[profile.default.overrides]]
filter = "test(/^snapshots::/)"
test-group = "gpu"
