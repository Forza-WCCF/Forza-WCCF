[workspace]
resolver = "3"
members = ["crates/*", "xtask", "xtask/cap"]
default-members = ["crates/*"]

[workspace.package]
version = "7.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# only what a crate uses is listed (ROADMAP step 4 has the full list); xtask: build, checks, the ZIP
anyhow = "1.0.104"
aes = "0.9.3"
clap = { version = "4.6.7", features = ["derive"] }
# GUI: eframe's defaults minus `web_screen_reader`
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "links", "wgpu", "wayland", "x11"] }
egui = { version = "0.36.2", default-features = false }
egui_extras = { version = "0.36.2", default-features = false }
egui_kittest = { version = "0.36.2", features = ["snapshot", "wgpu"] }
forza = { path = "crates/forza" }
rust-i18n = "4.2.4"
fs-err = "3.3.2"
junction = "2.1.0"
rfd = "0.17.2"
sha2 = "0.11.0"
xshell = "0.2.7"
crc32fast = "1.5.2"
fs4 = "1.1.0"
ntfs = "0.4.0"
pbkdf2 = "0.13.0"
ripemd = "0.2.0"
object = { version = "0.40.0", default-features = false, features = ["read_core", "pe"] }
serde_json = "1.0.154"
png = "0.18.1"
windows-sys = "0.61.2"
# Core Audio's COM interfaces (the start volumes), the one binding that has them: launcher::helper::sound only
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"

[profile.release]
opt-level = 3
lto = "thin"            # fat LTO + one codegen unit rebuilt the installer in 51 s, thin in 14 s; the exe is ~17 % larger
# panic unwinds (the default): a stand-in thread that panics ends alone, and the run's supervisor stops the game with
# a message (launcher::run check_threads); with "abort" the whole Launcher.exe vanished and the Job closed the game unsaid
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2            # egui, image, aes at usable speed in debug builds; our own code stays fast to compile
