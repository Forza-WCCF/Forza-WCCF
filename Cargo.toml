[workspace]
resolver = "3"
members = ["crates/*", "native/common", "native/detmath", "native/hook", "native/icmp", "native/netguard", "native/programs", "native/wccfnet", "xtask", "xtask/cap"]
default-members = ["crates/*"]

[workspace.package]
# what a plain `cargo build` shows (it has no FORZA_VERSION): the release number itself comes from the git tag, and the
# release cut on `next` sets this to it (cargo xtask sets FORZA_VERSION, see crates/launcher/version_rc.rs). Launcher,
# installer and panel inherit it; every other crate has its own, so an unchanged helper program (FPR_Emu.exe,
# logowin.exe) rebuilds byte-identical (docs/RELEASING.md)
version = "0.6.1"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# only what a crate uses is listed (docs/ARCHITECTURE.md has the crate per job); xtask: build, checks, the ZIP
anyhow = "1.0.104"
aes = "0.9.3"
clap = { version = "4.6.7", features = ["derive"] }
# GUI: eframe's defaults minus `web_screen_reader` and `system_fonts` (our own fonts); `clipboard` keeps paste from
# other programs; `glow` (OpenGL) first, wgpu the fallback when it cannot open the window (launcher, installer).
# `wgpu_no_default_features`: wgpu's backends come from the `wgpu` entry below
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "links", "wgpu_no_default_features", "glow", "wayland", "x11"] }
egui = { version = "0.37.0", default-features = false }
egui_extras = { version = "0.37.0", default-features = false }
emath = { version = "0.37.0", default-features = false }
# eframe's wgpu (same version) with only the DX12 backend: the Windows fallback renderer, without Vulkan, Metal, GL, WebGPU
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "dx12"] }
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }
forza = { path = "crates/forza" }
forza-ui = { path = "crates/forza-ui" }
rust-i18n = "4.2.4"
fs-err = "3.3.2"
junction = "2.1.0"
rfd = "0.17.2"
sha2 = "0.11.0"
md-5 = "0.11.0"
semver = "1.0.26"
self-replace = "1.5.0"
xshell = "0.2.7"
# dev-dependency only, never in a shipped binary: the property tests (the log scrub, the access codes, the game
# server's framing, the card reader's framing, xtask's name mask)
proptest = "1.12.0"
crc32fast = "1.5.2"
fs4 = "1.1.0"
ntfs = "0.4.0"
pbkdf2 = "0.13.0"
ripemd = "0.2.0"
object = { version = "0.40.0", default-features = false, features = ["read_core", "pe"] }
serde_json = "1.0.154"
png = "0.18.1"
windows-sys = "0.61.2"
# Core Audio's COM interfaces (the start volumes), the one binding that has them: forza::sound only
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
# direct VS (crates/vslink, docs/ARCHITECTURE.md "Online"): no portmapper (it would change the router), no metrics,
# ring for TLS (aws-lc-rs needs cmake + nasm)
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
tokio = "1.53.2"
bytes = "1.12.1"
getrandom = "0.3.4"
# the match engine's deterministic math (native/detmath): x86 decode/encode for its caves, f64 atan2 in plain SSE2
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "code_asm", "instr_info"] }
libm = "0.2.16"
# compile-time proofs that the in-game entry points cannot panic (tests only, never in a shipped DLL)
no-panic = "0.1.37"
tl = "0.7.8"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"

# Cargo's own lints (1.100): a dependency a crate does not use is reported at build time, inherited with the two tables
# above. It misses a dependency a path dependency also uses (a deliberately unused `md-5` in the server, which `forza`
# uses, is not reported); removing one of those stays a `cargo-shear` job (the ignored list below).
[workspace.lints.cargo]
unused_dependencies = "warn"

[workspace.metadata.cargo-shear]
# no code names it: launcher and installer depend on it for eframe's wgpu fallback, so feature unification leaves that
# renderer with its DX12 backend only (the `wgpu` entry above)
ignored = ["wgpu"]

[profile.release]
opt-level = 3
lto = "thin"            # fat LTO + one codegen unit rebuilt the installer in 51 s, thin in 14 s; the exe is ~17 % larger
# panic unwinds (the default): a stand-in thread that panics ends alone, and the run's supervisor stops the game with
# a message (launcher::run check_threads); with "abort" the whole Launcher.exe vanished and the Job closed the game unsaid
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2            # egui, image, aes at usable speed in debug builds; our own code stays fast to compile
debug = false            # no debug info for the crates.io code: less to generate and link; our own keeps its line tables

# `cargo xtask build` / `check quick` (without CI or `--release`) and `--fast`: local test kits, never a player's build
# (package always uses release).
# Release code without LTO, incremental: a change in forza recompiles and relinks without the thin-LTO pass.
# `check --fast` runs the tests in this profile too, so the dependencies compile once for the kits and the tests.
# The programs beside the game are built for size, not for speed: they format a few lines and write them to a pipe.
# Microsoft's engine flags small 32-bit programs of this shape (docs/RELEASING.md, "Antivirus verdicts"), so their code
# is kept as small and as plain as it goes. `panic` cannot be set per package; the workspace unwinds on purpose
# (profile.release above). 2026-11-01: with this alone, FPR_Emu.exe stopped being flagged (6 scans, see av-oracle).
[profile.release.package.forza-programs]
opt-level = "z"
codegen-units = 1

# 2026-11-02, 0.6.2: with the same sources and toolchain that shipped clean in 0.6.1, Microsoft's engine flagged both
# Launcher.exe and forza_panel.dll as Trojan:Win32/Wacatac.C!ml (the live install too), while FPR_Emu.exe and the four
# small programs stayed clean. Same lever as the programs above: keep their code small, and the shape that trips
# the model goes with it. `lto` cannot be set per package; the workspace keeps thin LTO.
[profile.release.package.launcher]
# 2026-11-14: opt-level "z" with one codegen unit was what cleared this program in 0.6.2, yet both 0.7.3 re-cuts came
# back as Trojan:Win32/Wacatac.B!ml and .C!ml on VirusTotal (35 291 136 bytes each, the local Defender clean on both),
# while the panel's sixteen codegen units (#250) read clean in the same cuts. Sixteen units reshape the same sources
# here too: the built file (7bee6ef1, 35 351 040 bytes) is undetected, 1/75 (Trapmine, not Microsoft). Measure a build
# with a VirusTotal analysis before changing this again (docs/RELEASING.md, "Antivirus verdicts").
opt-level = "z"
codegen-units = 16

[profile.release.package.forza-panel]
# 2026-11-12: opt-level "z" with one codegen unit above was what cleared this DLL in 0.6.2, yet the 0.7.3 re-cut
# (85ace7e4) came back as Trojan:Win32/Wacatac.B!ml on VirusTotal, 4 KB apart from the clean DLL of 0.7.3 first
# candidate, with the local Defender clean on both. Sixteen codegen units reshape the same sources: the built file
# (81bcf143) is undetected, 1/75 (VBA32, the same engine hit the flagged file). Measure a build with a VirusTotal
# analysis before changing this again (docs/RELEASING.md, "Antivirus verdicts"); lto and panic cannot be set per
# package.
opt-level = "z"
codegen-units = 16

# The setup wizard is the other big eframe program players download: same reason and same lever as the Launcher above,
# and it needs no speed.
[profile.release.package.wccf-installer]
opt-level = "z"
codegen-units = 1

# 2026-11-06, 0.7.0: Microsoft's engine flagged dmath.dll as Trojan:Win32/Wacatac.B!ml in 2 of 3 VirusTotal analyses of
# the release candidate, while 0.6.3's file was clean and the local Defender saw nothing: same lever as the programs
# above. It cannot move the math: the caves are assembled at run time by iced-x86, libm keeps its own opt-level, and the
# V4 hashes of the results are the same before and after (det-math ALL c4ca5aec).
[profile.release.package.forza-detmath]
opt-level = "z"
codegen-units = 1

[profile.fast]
inherits = "release"
lto = false
incremental = true

# `cargo xtask check ci` (CI's pull requests and pushes to main): release code without LTO, not incremental, and the
# tests in the same profile, so each dependency compiles once. The weekly run (`check ci --release`) and
# `cargo xtask package` build release, what players get.
[profile.ci]
inherits = "release"
lto = false

# FreeType 2.13.3 for the pictures with writing (vendor/freetype-sys/Cargo.toml says why)
[patch.crates-io]
freetype-sys = { path = "vendor/freetype-sys" }
