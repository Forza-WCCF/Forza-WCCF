[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "7.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# only what a crate uses is listed (ROADMAP step 4 has the full list); xtask: build, checks, the ZIP
anyhow = "1.0.104"
aes = "0.9.3"
clap = { version = "4.6.7", features = ["derive"] }
# GUI: eframe's defaults minus `web_screen_reader`; the installer adds `default_fonts` (it draws text, the repo has no fonts yet)
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "links", "wgpu", "wayland", "x11"] }
fs-err = "3.3.2"
rfd = "0.17.2"
sha2 = "0.11.0"
xshell = "0.2.7"
crc32fast = "1.5.2"
fs4 = "1.1.0"
ntfs = "0.4.0"
pbkdf2 = "0.13.0"
ripemd = "0.2.0"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"          # safe: children sit in a Job object with KILL_ON_JOB_CLOSE, so an abort still stops them
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2            # egui, image, aes at usable speed in debug builds; our own code stays fast to compile
