[package]
name = "forza-native"
version = "0.5.1" # its own version, not the release number (docs/RELEASING.md)
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "What the 32-bit DLLs and programs in and beside the game share: a loaded module's import table, local time, the parent process, the publisher's hosts kept unresolved"

# The game is 32-bit: everything here is for i686-pc-windows-msvc. On any other target the crate is empty (lib.rs).
[target.'cfg(target_arch = "x86")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# `#[cfg_attr(all(test, not(debug_assertions)), no_panic)]` on the panic-free cores of the calls the game makes: the
# test builds without debug assertions (the `fast`, `ci` and `release` profiles) fail to link if one can panic; never
# in a shipped DLL
[dev-dependencies]
no-panic = { workspace = true }

[lints]
workspace = true
