[package]
name = "forza-wccfnet"
version = "0.6.0" # its own version, not the release number (docs/RELEASING.md)
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The 2017-18 network guard: the game programs import it instead of IPHLPAPI.DLL; it also loads the panel"

[lib]
name = "wccfnet"
crate-type = ["cdylib"]

# 32-bit like the game (`cargo xtask build`); on any other target the crate is empty (lib.rs)
[target.'cfg(target_arch = "x86")'.dependencies]
forza-native = { path = "../common" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
