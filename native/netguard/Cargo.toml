[package]
name = "forza-netguard"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The 2010-11 Linux server's second network guard: the C server hook loads it into control and the match engines"

[lib]
name = "netguard"
crate-type = ["cdylib"]

# 32-bit like the game (`cargo xtask build`); on any other target the crate is empty (lib.rs)
[target.'cfg(target_arch = "x86")'.dependencies]
forza-native = { path = "../common" }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemServices"] }

[lints]
workspace = true
