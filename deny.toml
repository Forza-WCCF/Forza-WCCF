# cargo-deny: `cargo deny check licenses bans sources` (CI job `deny`). Licenses are the ones the dependency tree uses today
# (crates/installer/THIRD-PARTY-LICENSES.json is the notice bundle for the installer's share of it).

[graph]
targets = ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc"]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# the workspace's own crates carry no license field
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# path dependencies (vendor/freetype-sys, the workspace) are always allowed
